            ]},
            { type:'cardgroup', heading:'Watch Out For', cards:[
              { iconText:'!', color:'pink', title:'Rejecting Invalid Solutions', desc:'Since $a^{x}>0$ for every real $x$, any negative value of $u$ must be rejected.', example:{ from:'u=-1', to:'\\text{no solution}' } }
            ]}
          ]},
                    { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
            question:'Solve $2^{2x}-6(2^{x})+8=0$ for $x$.',
            steps:[
              { title:'Substitute u = 2ˣ', desc:'Since $2^{2x}=(2^{x})^{2}$, letting $u=2^{x}$ turns this into an ordinary quadratic in u',
                formula:'$u^{2}-6u+8=0$' },
              { title:'Factorise', desc:'Find two numbers that multiply to 8 and add to $-6$: these are $-2$ and $-4$',
                formula:'$(u-2)(u-4)=0 \\Rightarrow u=2$ or $u=4$' },
              { title:'Convert back to x', desc:'Remember u was standing in for $2^{x}$, so solve $2^{x}=u$ for each value found',
                formula:'$2^{x}=2 \\Rightarrow x=1$; &nbsp; $2^{x}=4 \\Rightarrow x=2$' },
              { title:'State both solutions', desc:'Since the substituted equation was quadratic, expect up to two solutions for x',
                formula:'<span class="np-highlight">$x=1$ or $x=2$</span>' }
            ]
          },
          { type:'remember', text:'Because $a^{x}$ is always positive, immediately reject any negative solution for a substituted variable like $u=a^{x}$ before solving for $x$.' },
          { type:'practice', text:'Try questions on solving exponential equations.', href:'maths-question-bank.html#qb=1.2.3' }
        ]
      }
    ] },
    { num:'1.3', title:'Sequences &amp; Series', subs:[
      { num:'1.3.1', title:'Language of Sequences &amp; Series',
        blocks:[
          { type:'intro', icon:'zap', color:'violet',
            text:'A sequence is an ordered list of numbers called terms. A series is what you get when you add the terms of a sequence together.',
            formula:'u_n \\ \\text{(term)}\\qquad S_n=\\sum_{r=1}^{n}u_r \\ \\text{(sum)}'
          },
          { type:'ingredients', heading:'Key Notation', items:[
            { iconText:'u', color:'cyan', label:'Term Notation', formula:'u_1,\\,u_2,\\,u_3,\\ldots,u_n', desc:'The 1st, 2nd, 3rd, ..., nth term' },
            { iconText:'Σ', color:'green', label:'Sigma Notation', formula:'\\sum_{r=1}^{n}u_r', desc:'Shorthand for a sum of terms' },
            { iconText:'Sₙ', color:'pink', label:'Sum Notation', formula:'S_n=u_1+u_2+\\cdots+u_n', desc:'The sum of the first n terms' }
          ]},
          { type:'columns', items:[
            { type:'cardgroup', heading:'Finite &amp; Infinite Sequences', cards:[
              { iconText:'F', color:'cyan', title:'Finite Sequence', desc:'Has a fixed, last term.', example:{ from:'2,4,6,8', to:'\\text{stops at }8' } },
              { iconText:'∞', color:'violet', title:'Infinite Sequence', desc:'Carries on forever.', example:{ from:'2,4,6,8,\\ldots', to:'\\text{never stops}' } }
            ]},
            { type:'steps', heading:'Using Sigma Notation', icon:'calculator', color:'amber', steps:[
              { title:'Identify the rule and limits', desc:'e.g. evaluate $\\displaystyle\\sum_{r=1}^{4}2r$', formula:'rule: $2r$, from $r=1$ to $r=4$' },
              { title:'Substitute each value of r', desc:'', formula:'$2(1)+2(2)+2(3)+2(4)$' },
              { title:'Add them up', desc:'', formula:'<span class="np-highlight">$2+4+6+8=20$</span>' }
            ]}
          ]},
          { type:'columns', items:[
            { type:'steps', heading:'Recursive Definitions', icon:'calculator', color:'amber', steps:[
              { title:'Start from the given first term', desc:'e.g. $u_1=3,\\ u_{n+1}=u_n+5$, find $u_4$', formula:'$u_1=3$' },
              { title:'Apply the rule repeatedly', desc:'', formula:'$u_2=8,\\quad u_3=13$' },
              { title:'Reach the required term', desc:'', formula:'<span class="np-highlight">$u_4=18$</span>' }
            ]},
            { type:'cardgroup', heading:'Recursive vs Explicit', cards:[
              { iconText:'R', color:'green', title:'Recursive Formula', desc:'Defines a term using the previous term.', example:{ from:'u_{n+1}=u_n+d', to:'\\text{needs }u_1' } },
              { iconText:'E', color:'pink', title:'Explicit Formula', desc:'Gives $u_n$ directly from $n$, with no earlier terms needed.', example:{ from:'u_n=u_1+(n-1)d', to:'\\text{direct}' } }
            ]}
          ]},
                    { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
            question:'A sequence has $u_n=\\dfrac{n^{2}+n}{2}$. Find $u_7$, and determine whether 45 is a term of the sequence.',
            steps:[
              { title:'Substitute n = 7', desc:'Replace every n in the formula with 7 to find this specific term',
                formula:'$u_7=\\dfrac{49+7}{2}=28$' },
              { title:'Set uₙ = 45', desc:'To check if 45 appears in the sequence, set the formula equal to 45 and see if a whole-number solution for n exists',
                formula:'$n^{2}+n=90 \\Rightarrow n^{2}+n-90=0$' },
              { title:'Solve the quadratic', desc:'Use the quadratic formula; reject the negative root since n must be a positive integer',
                formula:'$n=\\dfrac{-1+\\sqrt{361}}{2}=9$' },
              { title:'Conclude', desc:'since $n=9$ is a positive integer',
                formula:'<span class="np-highlight">45 is a term of the sequence ($u_9=45$)</span>' }
            ]
          },
          { type:'remember', text:'Don’t confuse $u_n$ (the value of just <b>one</b> term) with $S_n$ (the running total of the first $n$ terms) — they answer very different questions.' },
          { type:'practice', text:'Try questions on sequence and series notation.', href:'maths-question-bank.html#qb=1.3.1' }
        ]
      },
      { num:'1.3.2', title:'Arithmetic Sequences &amp; Series',
        blocks:[
          { type:'intro', icon:'zap', color:'violet',
            text:'In an arithmetic sequence, you add a fixed amount — the common difference — to get from one term to the next.',
            formula:'u_n=u_1+(n-1)d'
          },
          { type:'ingredients', heading:'Key Formulae', items:[
            { iconText:'d', color:'cyan', label:'Common Difference', formula:'d=u_{n+1}-u_n', desc:'The constant amount added each time' },
            { iconText:'uₙ', color:'green', label:'nth Term', formula:'u_n=u_1+(n-1)d', desc:'Jump straight to any term' },
            { iconText:'Sₙ', color:'pink', label:'Sum of n Terms', formula:'S_n=\\dfrac{n}{2}\\big(2u_1+(n-1)d\\big)', desc:'Or equivalently $S_n=\\dfrac{n}{2}(u_1+u_n)$' }
          ]},
          { type:'columns', items:[
            { type:'steps', heading:'Finding a Term', icon:'calculator', color:'amber', steps:[
              { title:'Identify u1 and d', desc:'e.g. $u_1=5,\\ d=3$, find $u_{10}$', formula:'$u_1=5,\\ d=3,\\ n=10$' },
              { title:'Substitute into the nth term formula', desc:'', formula:'$u_{10}=5+(10-1)(3)$' },
              { title:'Evaluate', desc:'', formula:'<span class="np-highlight">$u_{10}=32$</span>' }
            ]},
            { type:'cardgroup', heading:'Spotting an Arithmetic Sequence', cards:[
              { iconText:'+', color:'green', title:'Constant Difference', desc:'Check that consecutive terms always differ by the same amount.', example:{ from:'7,11,15,19', to:'d=4' } }
            ]}
          ]},
          { type:'columns', items:[
            { type:'steps', heading:'Finding the Sum', icon:'calculator', color:'amber', steps:[
              { title:'Identify u1, d and n', desc:'e.g. sum the first 20 terms with $u_1=4,\\ d=6$', formula:'$u_1=4,\\ d=6,\\ n=20$' },
              { title:'Substitute into the sum formula', desc:'', formula:'$S_{20}=\\dfrac{20}{2}\\big(2(4)+19(6)\\big)$' },
              { title:'Evaluate', desc:'', formula:'<span class="np-highlight">$S_{20}=1220$</span>' }
            ]},
            { type:'cardgroup', heading:'Finding the Number of Terms', cards:[
              { iconText:'n', color:'violet', title:'Solve for n', desc:'Set the nth term formula equal to the known last term.', example:{ from:'2+5(n-1)=97', to:'n=20' } }
            ]}
          ]},
                    { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
            question:'The 4th term of an arithmetic sequence is 15 and the 11th term is 43. Find $u_1$, $d$, and $S_{25}$.',
            steps:[
              { title:'Find d', desc:'Going from the 4th term to the 11th term takes 7 steps of size d, so the difference between the two given terms equals 7d',
                formula:'$43-15=7d \\Rightarrow d=4$' },
              { title:'Find u1', desc:'Work backwards 3 steps of size d from u4 to reach u1',
                formula:'$u_1=u_4-3d=15-12=3$' },
              { title:'Substitute into the sum formula', desc:'Use $S_n=\\dfrac{n}{2}(2u_1+(n-1)d)$ with $n=25$',
                formula:'$S_{25}=\\dfrac{25}{2}\\big(2(3)+24(4)\\big)$' },
              { title:'Evaluate', desc:'Simplify inside the brackets first, then multiply',
                formula:'<span class="np-highlight">$S_{25}=1275$</span>' }
            ]
          },
          { type:'remember', text:'Always check the difference is truly <b>constant</b> across several pairs of terms before assuming a sequence is arithmetic.' },
          { type:'practice', text:'Try questions on arithmetic sequences and series.', href:'maths-question-bank.html#qb=1.3.2' }
        ]
      },
      { num:'1.3.3', title:'Geometric Sequences &amp; Series',
        blocks:[
          { type:'intro', icon:'zap', color:'violet',
            text:'In a geometric sequence, you multiply by a fixed amount — the common ratio — to get from one term to the next.',
            formula:'u_n=u_1 r^{\\,n-1}'
          },
          { type:'ingredients', heading:'Key Formulae', items:[
            { iconText:'r', color:'cyan', label:'Common Ratio', formula:'r=\\dfrac{u_{n+1}}{u_n}', desc:'The constant multiplier each time' },
            { iconText:'uₙ', color:'green', label:'nth Term', formula:'u_n=u_1 r^{\\,n-1}', desc:'Jump straight to any term' },
            { iconText:'Sₙ', color:'pink', label:'Sum of n Terms', formula:'S_n=\\dfrac{u_1(r^{\\,n}-1)}{r-1}', desc:'For $r \\ne 1$' }
          ]},
          { type:'columns', items:[
            { type:'steps', heading:'Finding a Term', icon:'calculator', color:'amber', steps:[
              { title:'Identify u1 and r', desc:'e.g. $u_1=3,\\ r=2$, find $u_6$', formula:'$u_1=3,\\ r=2,\\ n=6$' },
              { title:'Substitute into the nth term formula', desc:'', formula:'$u_6=3(2)^{5}$' },
              { title:'Evaluate', desc:'', formula:'<span class="np-highlight">$u_6=96$</span>' }
            ]},
            { type:'cardgroup', heading:'Sign Patterns', cards:[
              { iconText:'±', color:'pink', title:'Negative Common Ratio', desc:'The terms alternate between positive and negative.', example:{ from:'r=-2', to:'4,-8,16,-32,\\ldots' } }
            ]}
          ]},
          { type:'columns', items:[
            { type:'steps', heading:'Finding the Sum', icon:'calculator', color:'amber', steps:[
              { title:'Identify u1, r and n', desc:'e.g. sum the first 5 terms with $u_1=5,\\ r=3$', formula:'$u_1=5,\\ r=3,\\ n=5$' },
              { title:'Substitute into the sum formula', desc:'', formula:'$S_5=\\dfrac{5(3^{5}-1)}{3-1}$' },
              { title:'Evaluate', desc:'', formula:'<span class="np-highlight">$S_5=605$</span>' }
            ]},
            { type:'cardgroup', heading:'Sum to Infinity', cards:[
              { iconText:'∞', color:'violet', title:'When It Exists', desc:'A sum to infinity only converges under this condition on r.', example:{ from:'|r|<1', to:'S_{\\infty}=\\dfrac{u_1}{1-r}' } }
            ]}
          ]},
                    { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
            question:'The sum of the first 3 terms of a geometric sequence is 26, and the sum of the first 6 terms is 728. Find $r$ and $u_1$.',
            steps:[
              { title:'Divide S6 by S3', desc:'This is a useful trick: dividing the two sum formulas cancels out $u_1$ and $(r-1)$, leaving an expression only in r',
                formula:'$\\dfrac{S_6}{S_3}=r^{3}+1=\\dfrac{728}{26}=28$' },
              { title:'Solve for r', desc:'Rearrange to isolate $r^{3}$, then take the cube root of both sides',
                formula:'$r^{3}=27 \\Rightarrow r=3$' },
              { title:'Substitute back into S3', desc:'Now that r is known, substitute it into the original sum formula for $S_3$ to find $u_1$',
                formula:'$26=u_1\\dfrac{(3^{3}-1)}{3-1}=13u_1$' },
              { title:'Evaluate', desc:'Divide both sides by 13',
                formula:'<span class="np-highlight">$u_1=2$</span>' }
            ]
          },
          { type:'remember', text:'A sum to infinity only makes sense when $|r|<1$ — if $|r|\\ge1$, the series diverges and has no finite sum.' },
          { type:'practice', text:'Try questions on geometric sequences and series.', href:'maths-question-bank.html#qb=1.3.3' }
        ]
      },
      { num:'1.3.4', title:'Applications of Sequences &amp; Series',
        blocks:[
          { type:'intro', icon:'zap', color:'violet',
            text:'Sequences and series model real situations that change by a fixed amount or a fixed percentage every step — from theatre seating to population growth.',
            formula:'u_n=u_1+(n-1)d \\quad\\text{or}\\quad u_n=u_1 r^{\\,n-1}'
          },
          { type:'ingredients', heading:'Key Ideas', items:[
            { iconText:'+', color:'cyan', label:'Arithmetic Model', desc:'Use when the same amount is added or removed every step' },
            { iconText:'×', color:'green', label:'Geometric Model', desc:'Use when the same percentage is gained or lost every step' },
            { iconText:'?', color:'pink', label:'Spotting Which to Use', desc:'Read the wording carefully — “by the same amount” vs “by the same percentage”' }
          ]},
          { type:'columns', items:[
            { type:'steps', heading:'Modelling with an Arithmetic Sequence', icon:'calculator', color:'amber', steps:[
              { title:'Identify the model', desc:'e.g. a theatre sells 40 tickets on day 1, and 5 more each following day', formula:'$u_1=40,\\ d=5$' },
              { title:'Find a specific term', desc:'Tickets sold on day 10', formula:'$u_{10}=40+9(5)=85$' },
              { title:'Find the total', desc:'Total tickets sold across the first 10 days', formula:'<span class="np-highlight">$S_{10}=\\dfrac{10}{2}(2(40)+9(5))=625$</span>' }
            ]},
            { type:'cardgroup', heading:'Reading the Wording', cards:[
              { iconText:'A', color:'cyan', title:'“Increases by 5 each week”', desc:'A fixed amount — arithmetic.', example:{ from:'d=5', to:'u_n=u_1+(n-1)5' } },
              { iconText:'G', color:'green', title:'“Increases by 5% each week”', desc:'A fixed percentage — geometric.', example:{ from:'r=1.05', to:'u_n=u_1(1.05)^{\\,n-1}' } }
            ]}
          ]},
          { type:'columns', items:[
            { type:'steps', heading:'Modelling with a Geometric Sequence', icon:'calculator', color:'amber', steps:[
              { title:'Identify the model', desc:'e.g. a town of 5000 people grows 4% every year', formula:'$u_1=5000,\\ r=1.04$' },
              { title:'Substitute into the nth term formula', desc:'Population after 6 years', formula:'$u_7=5000(1.04)^{6}$' },
              { title:'Evaluate', desc:'', formula:'<span class="np-highlight">$u_7\\approx6327$</span>' }
            ]},
            { type:'cardgroup', heading:'Converting a Percentage to r', cards:[
              { iconText:'↑', color:'green', title:'Percentage Increase', desc:'Add the percentage to 1 (as a decimal).', example:{ from:'\\text{+4}\\%', to:'r=1.04' } },
              { iconText:'↓', color:'pink', title:'Percentage Decrease', desc:'Subtract the percentage from 1 (as a decimal).', example:{ from:'\\text{-4}\\%', to:'r=0.96' } }
            ]}
          ]},
                    { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
            question:'A car worth \\$20\\,000 depreciates by 12% each year. A savings account starts at \\$5000 and grows by \\$800 each year. After how many complete years does the savings account first exceed the car’s value?',
            steps:[
              { title:'Model each quantity', desc:'The car loses a fixed percentage of its value each year, so it follows a geometric model; the savings account gains a fixed amount each year, so it follows an arithmetic model',
                formula:'car: $20\\,000(0.88)^{n}$; savings: $5000+800n$' },
              { title:'Test n = 5', desc:'Substitute n=5 into both models to compare their values at that point',
                formula:'car $\\approx\\$10\\,555$; savings $=\\$9000$ (savings still behind)' },
              { title:'Test n = 6', desc:'Since the savings account hasn’t caught up yet, try the next year',
                formula:'car $\\approx\\$9288$; savings $=\\$9800$ (savings now ahead)' },
              { title:'Conclude', desc:'The savings account overtakes the car’s value somewhere between year 5 and year 6, so the first complete year it is ahead is year 6',
                formula:'<span class="np-highlight">the savings account first exceeds the car after 6 years</span>' }
            ]
          },
          { type:'remember', text:'Take care with which term counts as the starting point — if a population starts at $u_1$ and grows for 6 more years, that lands on $u_7$, not $u_6$.' },
          { type:'practice', text:'Try questions on modelling with sequences and series.', href:'maths-question-bank.html#qb=1.3.4' }
        ]
      },
      { num:'1.3.5', title:'Compound Interest &amp; Depreciation',
        blocks:[
          { type:'intro', icon:'zap', color:'violet',
            text:'Compound interest and depreciation are geometric sequences in disguise — money grows or loses value by a fixed percentage each compounding period.',
            formula:'FV=PV\\left(1+\\dfrac{r}{100k}\\right)^{kn}'
          },
          { type:'ingredients', heading:'Key Variables', items:[
            { iconText:'PV', color:'cyan', label:'Present Value', desc:'The starting amount' },
            { iconText:'FV', color:'green', label:'Future Value', desc:'The amount after n years' },
            { icon:'calculator', color:'pink', label:'Rate, Frequency &amp; Time', desc:'$r\\%$ per year, compounded $k$ times a year, for $n$ years' }
          ]},
          { type:'columns', items:[
            { type:'steps', heading:'Compound Interest Example', icon:'calculator', color:'amber', steps:[
              { title:'Identify PV, r, k and n', desc:'e.g. 2000 invested at 5% p.a., compounded annually, for 3 years', formula:'$PV=2000,\\ r=5,\\ k=1,\\ n=3$' },
              { title:'Substitute into the formula', desc:'', formula:'$FV=2000\\left(1+\\dfrac{5}{100}\\right)^{3}$' },
              { title:'Evaluate', desc:'', formula:'<span class="np-highlight">$FV\\approx2315.25$</span>' }
            ]},
            { type:'cardgroup', heading:'Compounding Frequency', cards:[
              { iconText:'k', color:'violet', title:'Times per Year', desc:'Annual: $k=1$, semi-annual: $k=2$, quarterly: $k=4$, monthly: $k=12$.' }
            ]}
          ]},
          { type:'columns', items:[
            { type:'steps', heading:'Depreciation Example', icon:'calculator', color:'amber', steps:[
              { title:'Identify PV, r and n', desc:'e.g. a car valued at 18\\,000 depreciating 12% per year, for 4 years', formula:'$PV=18\\,000,\\ r=12,\\ n=4$' },
              { title:'Substitute (rate is now subtracted)', desc:'', formula:'$FV=18\\,000(1-0.12)^{4}$' },
              { title:'Evaluate', desc:'', formula:'<span class="np-highlight">$FV\\approx10\\,794.52$</span>' }
            ]},
            { type:'cardgroup', heading:'Using Your GDC', cards:[
              { iconText:'fx', color:'teal', title:'Finance Solver', desc:'The IB allows you to use your calculator’s built-in TVM (finance) app for these questions instead of the formula.' }
            ]}
          ]},
                    { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
            question:'\\$8000 is invested at 3.5% p.a. compounded monthly. Find the value after 4 years, and the number of complete years for the investment to double.',
            steps:[
              { title:'Substitute into the compound interest formula', desc:'Since interest compounds monthly, divide the annual rate by 12 and multiply the number of years by 12 to get the total number of compounding periods',
                formula:'$FV=8000\\left(1+\\dfrac{0.035}{12}\\right)^{48}\\approx\\$9200$' },
              { title:'Set up the doubling equation', desc:'For the investment to double, the future value must equal twice the original amount',
                formula:'$8000(1+\\tfrac{0.035}{12})^{12n}=16\\,000$' },
              { title:'Solve for n', desc:'Take logarithms of both sides to bring the exponent down, then isolate n',
                formula:'$12n=\\dfrac{\\ln2}{\\ln(1+\\frac{0.035}{12})}\\approx237.98$' },
              { title:'Round up to complete years', desc:'Since $237.98\\div12\\approx19.83$, the investment hasn’t doubled by year 19, so round up to the next whole year',
                formula:'<span class="np-highlight">$n=20$ years</span>' }
            ]
          },
          { type:'remember', text:'In the compound interest formula, always match $n$ (years) and $k$ (compounding periods per year) consistently in the exponent $kn$ — mixing them up is the most common error.' },
          { type:'practice', text:'Try questions on compound interest and depreciation.', href:'maths-question-bank.html#qb=1.3.5' }
        ]
      }
    ] },
    { num:'1.4', title:'Simple Proof &amp; Reasoning', subs:[
      { num:'1.4.1', title:'Proof',
        blocks:[
          { type:'intro', icon:'zap', color:'violet',
            text:'A mathematical proof is a logical argument that shows a statement is true in every possible case — not just in the examples you happen to check.',
            formula:'P \\Rightarrow Q'
          },
          { type:'ingredients', heading:'Key Proof Methods', items:[
            { iconText:'1', color:'cyan', label:'Direct Proof', desc:'Reason forward from known facts and definitions to the result' },
            { iconText:'2', color:'green', label:'Proof by Exhaustion', desc:'Check every possible case individually — only works for finitely many cases' },
            { iconText:'3', color:'pink', label:'Disproof by Counter-Example', desc:'Find one case where a statement fails to disprove it completely' }
          ]},
          { type:'columns', items:[
            { type:'steps', heading:'Direct Proof Example', icon:'calculator', color:'amber', steps:[
              { title:'Write the numbers using a definition', desc:'Prove that the sum of two even numbers is always even. Let the two even numbers be $2m$ and $2n$, for integers $m$ and $n$.', formula:'$2m+2n$' },
              { title:'Add and factorise', desc:'', formula:'$2m+2n=2(m+n)$' },
              { title:'Conclude', desc:'Since $m+n$ is an integer, $2(m+n)$ is a multiple of 2.', formula:'<span class="np-highlight">$\\therefore$ the sum of two even numbers is even</span>' }
            ]},
            { type:'cardgroup', heading:'Key Definitions', cards:[
              { iconText:'2k', color:'cyan', title:'Even Number', desc:'Any integer that is a multiple of 2.', example:{ from:'n', to:'2k' } },
              { iconText:'2k+1', color:'green', title:'Odd Number', desc:'One more than an even number.', example:{ from:'n', to:'2k+1' } }
            ]}
          ]},
          { type:'columns', items:[
            { type:'steps', heading:'Proof by Exhaustion Example', icon:'calculator', color:'amber', steps:[
              { title:'State the claim', desc:'Prove that this expression is even for every integer from 1 to 4', formula:'$n^{2}+n$' },
              { title:'Check every case', desc:'', formula:'$n=1:2,\\quad n=2:6,\\quad n=3:12,\\quad n=4:20$' },
              { title:'Conclude', desc:'Every value obtained is even', formula:'<span class="np-highlight">$\\therefore n^{2}+n$ is even for $1\\le n\\le4$</span>' }
            ]},
            { type:'cardgroup', heading:'Disproof by Counter-Example', cards:[
              { iconText:'!', color:'pink', title:'One Example Is Enough', desc:'A single counter-example is enough to disprove a general statement.', example:{ from:'\\text{“all primes are odd”}', to:'2\\text{ is prime and even}' } }
            ]}
          ]},
                    { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
            question:'Prove that the square of any odd integer is odd. Hence determine, without calculating $57^{2}$, whether it is odd or even.',
            steps:[
              { title:'Represent an odd integer algebraically', desc:'let the odd integer be $2k+1$, for integer $k$',
                formula:'$(2k+1)^{2}=4k^{2}+4k+1$' },
              { title:'Rewrite in the form 2m + 1', desc:'Factor a 2 out of the first two terms, so the expression matches the definition of an odd number',
                formula:'$=2(2k^{2}+2k)+1$' },
              { title:'Conclude the proof', desc:'since $2k^2+2k$ is an integer, this is odd',
                formula:'$\\therefore$ the square of any odd integer is odd' },
              { title:'Apply the result', desc:'The general result proven above guarantees that since 57 is odd, $57^{2}$ must also be odd — without needing to calculate $57^{2}=3249$ directly',
                formula:'<span class="np-highlight">$57^{2}$ is odd</span>' }
            ]
          },
          { type:'remember', text:'One counter-example is enough to <b>disprove</b> a general statement, but checking examples can never <b>prove</b> one true — except in proof by exhaustion, where every single case is checked.' },
          { type:'practice', text:'Try questions on proof and reasoning.', href:'maths-question-bank.html#qb=1.4.1' }
        ]
      }
    ] },
    { num:'1.5', title:'Further Proof &amp; Reasoning', subs:[
    { num:'1.5.1', title:'Proof by Induction',
      blocks:[
        { type:'intro', icon:'zap', color:'violet',
          text:'Proof by induction shows a statement is true for every positive integer by proving it for a starting value, then showing truth passes from each case to the next.',
          formula:'P(1)\\text{ true, and } P(k)\\Rightarrow P(k+1) \\implies P(n)\\text{ true }\\forall n'
        },
        { type:'ingredients', heading:'Steps of Induction', items:[
          { iconText:'1', color:'cyan', label:'Base Case', desc:'Show the statement holds for the starting value (usually n = 1)' },
          { iconText:'2', color:'green', label:'Inductive Hypothesis', desc:'Assume the statement is true for n = k' },
          { iconText:'3', color:'pink', label:'Inductive Step', desc:'Use the assumption to prove it holds for n = k + 1' },
          { iconText:'4', color:'violet', label:'Conclusion', desc:'State that by induction, the statement is true for all n in the domain' }
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Induction Example: Sum Formula', icon:'calculator', color:'amber', steps:[
            { title:'State the base case', desc:'Prove $\\sum_{r=1}^{n} r = \\dfrac{n(n+1)}{2}$ for $n=1$', formula:'$LHS=1,\\ RHS=\\dfrac{1(2)}{2}=1$ &#10003;' },
            { title:'Assume true for n = k', desc:'', formula:'$\\displaystyle\\sum_{r=1}^{k} r = \\dfrac{k(k+1)}{2}$' },
            { title:'Add the (k+1)th term', desc:'', formula:'$\\displaystyle\\sum_{r=1}^{k+1} r = \\dfrac{k(k+1)}{2}+(k+1)$' },
            { title:'Show it matches the n = k+1 form', desc:'', formula:'<span class="np-highlight">$=\\dfrac{(k+1)(k+2)}{2}$</span>' }
          ]},
          { type:'cardgroup', heading:'The Four-Part Structure', cards:[
            { iconText:'B', color:'cyan', title:'Base Case', desc:'Verify the statement is true for the smallest value of n.' },
            { iconText:'H', color:'green', title:'Hypothesis', desc:'Assume true for n = k — this is a tool, not something you prove.' }
          ]}
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Induction with Divisibility', icon:'calculator', color:'amber', steps:[
            { title:'State the base case', desc:'Prove $3^{2n}-1$ is divisible by 8, for $n=1$', formula:'$3^{2}-1=8=8(1)$ &#10003;' },
            { title:'Assume true for n = k', desc:'', formula:'$3^{2k}-1=8m$ for some integer m' },
            { title:'Consider the n = k+1 case', desc:'', formula:'$3^{2(k+1)}-1=9\\cdot3^{2k}-1=9(8m+1)-1$' },
            { title:'Simplify to show divisibility', desc:'', formula:'<span class="np-highlight">$=72m+8=8(9m+1)$</span>' }
          ]},
          { type:'cardgroup', heading:'Conclusion Statement', cards:[
            { iconText:'&there4;', color:'pink', title:'Always Finish With This', desc:'Since true for $n=1$, and $n=k$ true implies $n=k+1$ true, by induction it is true for all $n\\ge1$.' }
          ]}
        ]},
                { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
          question:'Prove by induction that $\\displaystyle\\sum_{r=1}^{n} r^{3} = \\left(\\dfrac{n(n+1)}{2}\\right)^{2}$ for every positive integer $n$. Hence find $\\displaystyle\\sum_{r=1}^{6} r^{3}$.',
          steps:[
            { title:'Base case n = 1', desc:'Check that both sides of the formula agree when n=1',
              formula:'$LHS=1,\\ RHS=\\left(\\tfrac{1(2)}{2}\\right)^{2}=1$ &#10003;' },
            { title:'Assume true for n = k', desc:'This is the inductive hypothesis — assume (but don’t yet prove) that the formula holds when n=k',
              formula:'$\\displaystyle\\sum_{r=1}^{k} r^{3}=\\left(\\dfrac{k(k+1)}{2}\\right)^{2}$' },
            { title:'Add the (k+1)th term', desc:'Add $(k+1)^{3}$ to both sides, since this is the next term of the sum, then show it simplifies to match the formula with n=k+1 substituted in',
              formula:'$\\left(\\dfrac{k(k+1)}{2}\\right)^{2}+(k+1)^{3}=\\left(\\dfrac{(k+1)(k+2)}{2}\\right)^{2}$' },
            { title:'State the conclusion', desc:'true for $n=1$, and $n=k$ true $\\Rightarrow n=k+1$ true, so by induction it holds for all $n\\geq1$',
              formula:'' },
            { title:'Evaluate at n = 6', desc:'Substitute n=6 into the now-proven formula',
              formula:'<span class="np-highlight">$\\left(\\tfrac{6(7)}{2}\\right)^{2}=441$</span>' }
          ]
        },
        { type:'remember', text:'The inductive hypothesis (assuming true for n = k) is not something you prove — it’s the tool you use to prove the n = k+1 case. Forgetting the base case, or the final conclusion sentence, loses marks even when the algebra is right.' },
        { type:'practice', text:'Try questions on proof by induction.', href:'maths-question-bank.html#qb=1.5.1' }
      ]
    },
    { num:'1.5.2', title:'Proof by Contradiction',
      blocks:[
        { type:'intro', icon:'zap', color:'violet',
          text:'Proof by contradiction assumes the opposite of what you want to prove, then shows this assumption leads to something impossible — so the original statement must be true.',
          formula:'\\text{assume } \\neg P \\implies \\text{contradiction} \\implies P\\text{ true}'
        },
        { type:'ingredients', heading:'Key Steps', items:[
          { iconText:'1', color:'cyan', label:'Assume the Negation', desc:'Suppose the statement is false' },
          { iconText:'2', color:'green', label:'Follow the Logic', desc:'Use valid steps to reach a conclusion' },
          { iconText:'3', color:'pink', label:'Reach a Contradiction', desc:'Show the conclusion is impossible, or contradicts a known fact' },
          { iconText:'4', color:'violet', label:'Conclude', desc:'The original statement must be true' }
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Classic Example: &radic;2 is Irrational', icon:'calculator', color:'amber', steps:[
            { title:'Assume the opposite', desc:'Suppose $\\sqrt2$ is rational', formula:'$\\sqrt2=\\dfrac{p}{q}$, in lowest terms, for integers $p,q$' },
            { title:'Square both sides', desc:'', formula:'$2=\\dfrac{p^{2}}{q^{2}} \\Rightarrow p^{2}=2q^{2}$' },
            { title:'Deduce p is even', desc:'$p^2$ is even, so p must be even', formula:'$p=2m \\Rightarrow 4m^{2}=2q^{2} \\Rightarrow q^{2}=2m^{2}$' },
            { title:'Reach the contradiction', desc:'q must also be even — but p, q were in lowest terms', formula:'<span class="np-highlight">contradiction $\\Rightarrow \\sqrt2$ is irrational</span>' }
          ]},
          { type:'cardgroup', heading:'Infinitely Many Primes', cards:[
            { iconText:'&infin;', color:'cyan', title:'Euclid’s Argument', desc:'Assume finitely many primes, multiply them all and add 1 — the result has a prime factor not in the list, a contradiction.' }
          ]}
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Negating a Statement', icon:'calculator', color:'amber', steps:[
            { title:'Identify the statement', desc:'e.g. “there exist no integers x, y with $2x+4y=7$”', formula:'to prove this, assume the opposite' },
            { title:'Assume integers exist', desc:'', formula:'$2x+4y=7$ for some integers $x,y$' },
            { title:'Look for the contradiction', desc:'The left side is always even', formula:'$2(x+2y)=7$' },
            { title:'Conclude', desc:'', formula:'<span class="np-highlight">7 is odd — contradiction, so no such integers exist</span>' }
          ]},
          { type:'cardgroup', heading:'Spotting When to Use It', cards:[
            { iconText:'!', color:'pink', title:'Good Signal Words', desc:'Statements with “there is no…”, “…is irrational”, or “…cannot both be true” are natural fits for contradiction.' }
          ]}
        ]},
                { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
          question:'Prove by contradiction that if $p$ is a prime number and $p>2$, then $p$ is odd.',
          steps:[
            { title:'Assume the opposite', desc:'To prove by contradiction, start by assuming the statement is false',
              formula:'$p=2k$ for some integer $k$' },
            { title:'Consider the factors of p', desc:'since $p>2$, we have $k>1$',
              formula:'$1, 2, k,$ and $p$ are all factors of $p$' },
            { title:'Reach the contradiction', desc:'a prime number has exactly two factors, 1 and itself',
              formula:'this contradicts $p$ being prime' },
            { title:'Conclude', desc:'Since assuming p is even led to a contradiction, the original assumption must be false',
              formula:'<span class="np-highlight">$\\therefore$ if $p$ is prime and $p>2$, then $p$ is odd</span>' }
          ]
        },
        { type:'remember', text:'Contradiction and induction are different tools: induction proves a statement for all n by building up from a base case; contradiction proves a single statement by assuming it’s false and finding an impossibility.' },
        { type:'practice', text:'Try questions on proof by contradiction.', href:'maths-question-bank.html#qb=1.5.2' }
      ]
    }
  ] },
  { num:'1.6', title:'Binomial Theorem', subs:[
    { num:'1.6.1', title:'Binomial Theorem',
      blocks:[
        { type:'intro', icon:'zap', color:'violet',
          text:'The binomial theorem gives a quick way to expand $(a+b)^{n}$ without multiplying out every bracket by hand.',
          formula:'(a+b)^{n}=\\sum_{r=0}^{n}\\binom{n}{r}a^{n-r}b^{r}'
        },
        { type:'ingredients', heading:'Key Ingredients', items:[
          { iconText:'n', color:'cyan', label:'Power (n)', desc:'A positive integer — the total number of factors' },
          { iconText:'C', color:'green', label:'Binomial Coefficient', formula:'\\binom{n}{r}=\\dfrac{n!}{r!(n-r)!}', desc:'Also written ${}^{n}C_{r}$' },
          { iconText:'r', color:'pink', label:'Term Number (r)', desc:'Runs from 0 to n; gives the $(r+1)$th term' }
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Expanding a Binomial', icon:'calculator', color:'amber', steps:[
            { title:'Write the general term', desc:'e.g. expand $(2x+3)^{4}$', formula:'$T_{r+1}=\\binom{4}{r}(2x)^{4-r}(3)^{r}$' },
            { title:'Substitute r = 0, 1, 2, 3, 4', desc:'', formula:'$\\binom{4}{0}(2x)^{4}+\\binom{4}{1}(2x)^{3}(3)+\\ldots$' },
            { title:'Simplify each term', desc:'', formula:'<span class="np-highlight">$16x^{4}+96x^{3}+216x^{2}+216x+81$</span>' }
          ]},
          { type:'cardgroup', heading:'Pascal’s Triangle', cards:[
            { iconText:'&#9651;', color:'violet', title:'Reading Off Coefficients', desc:'Row n of Pascal’s triangle gives the coefficients of $(a+b)^{n}$ directly.', example:{ from:'(a+b)^{3}', to:'1,3,3,1' } }
          ]}
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Finding a Specific Term', icon:'calculator', color:'amber', steps:[
            { title:'Identify which term is needed', desc:'e.g. find the term in $x^{5}$ in $(x+2)^{8}$', formula:'$T_{r+1}=\\binom{8}{r}x^{8-r}(2)^{r}$, need $8-r=5 \\Rightarrow r=3$' },
            { title:'Substitute r', desc:'', formula:'$T_{4}=\\binom{8}{3}x^{5}(2)^{3}$' },
            { title:'Evaluate the coefficient', desc:'', formula:'<span class="np-highlight">$56\\times8=448$, so $448x^{5}$</span>' }
          ]},
          { type:'cardgroup', heading:'Useful Properties', cards:[
            { iconText:'&Sigma;', color:'teal', title:'Sum of Coefficients', desc:'Setting $a=b=1$ gives the sum of all binomial coefficients.', example:{ from:'(1+1)^{n}', to:'2^{n}' } }
          ]}
        ]},
                { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
          question:'Find the coefficient of $x^{3}$ in the expansion of $(2+3x)^{6}$.',
          steps:[
            { title:'Write the general term', desc:'Every term in the expansion has this form, where r runs from 0 to 6',
              formula:'$T_{r+1}=\\binom{6}{r}(2)^{6-r}(3x)^{r}$' },
            { title:'Identify r', desc:'need the term in $x^{3}$',
              formula:'$r=3$' },
            { title:'Substitute', desc:'Plug r=3 into the general term',
              formula:'$T_4=\\binom{6}{3}(2)^{3}(3)^{3}x^{3}$' },
            { title:'Evaluate the coefficient', desc:'Calculate each part separately: $\\binom{6}{3}=20$, $2^{3}=8$, and $3^{3}=27$, then multiply them together',
              formula:'<span class="np-highlight">$20\\times8\\times27=4320$</span>' }
          ]
        },
        { type:'remember', text:'The term number is $r+1$, not $r$ — a very common slip is reporting the coefficient for $T_{r}$ instead of $T_{r+1}$ when the question asks for “the term in $x^{k}$”.' },
        { type:'practice', text:'Try questions on binomial expansions.', href:'maths-question-bank.html#qb=1.6.1' }
      ]
    },
    { num:'1.6.2', title:'Extension of The Binomial Theorem',
      blocks:[
        { type:'intro', icon:'zap', color:'violet',
          text:'For a negative or fractional power n, $(1+x)^{n}$ no longer terminates — it becomes an infinite series, valid only for a restricted range of x.',
          formula:'(1+x)^{n}=1+nx+\\dfrac{n(n-1)}{2!}x^{2}+\\dfrac{n(n-1)(n-2)}{3!}x^{3}+\\cdots,\\ |x|<1'
        },
        { type:'ingredients', heading:'Key Ingredients', items:[
          { iconText:'n', color:'cyan', label:'Power (n)', desc:'Now negative or a fraction — not a positive integer' },
          { iconText:'|x|<1', color:'green', label:'Validity Condition', desc:'The expansion only converges when $|x|<1$' },
          { iconText:'(1+..)', color:'pink', label:'Must Start With 1', desc:'Factor out a constant first if the bracket isn’t already $(1+x)^{n}$' }
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Expanding with a Negative Power', icon:'calculator', color:'amber', steps:[
            { title:'Identify n and x', desc:'e.g. expand $(1+x)^{-2}$ up to the term in $x^{3}$', formula:'$n=-2$' },
            { title:'Substitute into the general expansion', desc:'', formula:'$1+(-2)x+\\dfrac{(-2)(-3)}{2!}x^{2}+\\dfrac{(-2)(-3)(-4)}{3!}x^{3}$' },
            { title:'Simplify', desc:'', formula:'<span class="np-highlight">$1-2x+3x^{2}-4x^{3}$</span>' }
          ]},
          { type:'cardgroup', heading:'When the Bracket Isn’t (1+x)', cards:[
            { iconText:'k', color:'violet', title:'Factor Out a Constant', desc:'Rewrite $(a+bx)^{n}$ as $a^{n}\\left(1+\\frac{b}{a}x\\right)^{n}$ first.', example:{ from:'(2+x)^{-1}', to:'\\tfrac12\\left(1+\\tfrac{x}{2}\\right)^{-1}' } }
          ]}
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Expanding with a Fractional Power', icon:'calculator', color:'amber', steps:[
            { title:'Identify n and x', desc:'e.g. expand $\\sqrt{1-2x}=(1-2x)^{1/2}$ up to the term in $x^{2}$', formula:'$n=\\tfrac12$, replacing $x$ with $-2x$' },
            { title:'Substitute into the expansion', desc:'', formula:'$1+\\tfrac12(-2x)+\\dfrac{\\tfrac12\\left(-\\tfrac12\\right)}{2!}(-2x)^{2}$' },
            { title:'Simplify', desc:'', formula:'<span class="np-highlight">$1-x-\\tfrac12x^{2}$</span>' }
          ]},
          { type:'cardgroup', heading:'Validity Range', cards:[
            { iconText:'|x|', color:'teal', title:'Finding the Range for x', desc:'If x is replaced (e.g. by $2x$), adjust the validity condition to match.', example:{ from:'|-2x|<1', to:'|x|<\\tfrac12' } }
          ]}
        ]},
                { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
          question:'Expand $(1+3x)^{-2}$ in ascending powers of $x$ up to the term in $x^{3}$, and state the range of validity.',
          steps:[
            { title:'Use the general expansion with u = 3x', desc:'This is the standard expansion for a power of $-2$, valid whenever $|u|<1$',
              formula:'$(1+u)^{-2}=1-2u+3u^{2}-4u^{3}+\\ldots$' },
            { title:'Substitute u = 3x', desc:'Replace every u with 3x',
              formula:'$1-2(3x)+3(3x)^{2}-4(3x)^{3}$' },
            { title:'Simplify', desc:'Multiply out each term carefully',
              formula:'<span class="np-highlight">$1-6x+27x^{2}-108x^{3}$</span>' },
            { title:'State the validity', desc:'The expansion only converges when the substituted value satisfies this condition',
              formula:'valid for $|3x|<1$, i.e. $|x|<\\dfrac13$' }
          ]
        },
        { type:'remember', text:'This general expansion is only valid for a non-integer or negative power, and only converges for $|x|<1$ — always state the range of validity when asked.' },
        { type:'practice', text:'Try questions on extended binomial expansions.', href:'maths-question-bank.html#qb=1.6.2' }
      ]
    }
  ] },
  { num:'1.7', title:'Permutations &amp; Combinations', subs:[
    { num:'1.7.1', title:'Counting Principles',
      blocks:[
        { type:'intro', icon:'zap', color:'violet',
          text:'Counting principles let you work out how many ways a sequence of choices can happen, without listing every outcome.',
          formula:'\\text{total outcomes} = n_{1}\\times n_{2}\\times \\cdots \\times n_{k}'
        },
        { type:'ingredients', heading:'Key Principles', items:[
          { iconText:'&times;', color:'cyan', label:'Multiplicative Principle', desc:'If one event has m outcomes and another has n, together there are $m\\times n$ outcomes' },
          { iconText:'+', color:'green', label:'Additive Principle', desc:'If choices are mutually exclusive alternatives, add the number of outcomes' },
          { iconText:'n!', color:'pink', label:'Factorial Notation', formula:'n!=n\\times(n-1)\\times\\cdots\\times2\\times1', desc:'The number of ways to arrange n distinct objects' }
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Multiplicative Principle Example', icon:'calculator', color:'amber', steps:[
            { title:'Break the task into stages', desc:'e.g. a password has 3 letters then 2 digits', formula:'26 choices per letter, 10 per digit' },
            { title:'Multiply the choices', desc:'', formula:'$26\\times26\\times26\\times10\\times10$' },
            { title:'Evaluate', desc:'', formula:'<span class="np-highlight">$1\\,757\\,600$</span>' }
          ]},
          { type:'cardgroup', heading:'With Repetition vs Without', cards:[
            { iconText:'R', color:'violet', title:'With Repetition', desc:'The same choice is available at every stage.', example:{ from:'\\text{3 digits, 0-9}', to:'10\\times10\\times10' } },
            { iconText:'N', color:'teal', title:'Without Repetition', desc:'Each choice removes an option for the next stage.', example:{ from:'\\text{3 digits, no repeats}', to:'10\\times9\\times8' } }
          ]}
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Additive Principle Example', icon:'calculator', color:'amber', steps:[
            { title:'Identify mutually exclusive cases', desc:'e.g. choose a starter OR a dessert, from 4 starters and 3 desserts', formula:'4 ways or 3 ways' },
            { title:'Add the outcomes', desc:'', formula:'$4+3$' },
            { title:'Evaluate', desc:'', formula:'<span class="np-highlight">$7$ total choices</span>' }
          ]},
          { type:'cardgroup', heading:'0! and Factorial Growth', cards:[
            { iconText:'0!', color:'cyan', title:'0! = 1', desc:'By definition, there is exactly one way to arrange zero objects.' }
          ]}
        ]},
                { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
          question:'A password has 3 letters (repeats allowed) followed by 3 digits. The password cannot start with the letter Q, and cannot end in the digit 0. Find the number of possible passwords.',
          steps:[
            { title:'Count the letter choices', desc:'first letter: 25 (not Q); other 2 letters: 26 each',
              formula:'$25\\times26\\times26=16\\,900$' },
            { title:'Count the digit choices', desc:'last digit: 9 (not 0); other 2 digits: 10 each',
              formula:'$10\\times10\\times9=900$' },
            { title:'Multiply the two stages', desc:'Since the letters and digits are chosen independently, multiply the total number of ways for each',
              formula:'$16\\,900\\times900$' },
            { title:'Evaluate', desc:'This is the total number of valid passwords',
              formula:'<span class="np-highlight">$15\\,210\\,000$</span>' }
          ]
        },
        { type:'remember', text:'Multiply for a sequence of independent stages (“and”); add for mutually exclusive alternatives (“or”). Mixing these up is the most common error in counting problems.' },
        { type:'practice', text:'Try questions on counting principles.', href:'maths-question-bank.html#qb=1.7.1' }
      ]
    },
    { num:'1.7.2', title:'Permutations &amp; Combinations',
      blocks:[
        { type:'intro', icon:'zap', color:'violet',
          text:'Permutations count arrangements where order matters; combinations count selections where order doesn’t.',
          formula:'{}^{n}P_{r}=\\dfrac{n!}{(n-r)!}\\qquad {}^{n}C_{r}=\\dfrac{n!}{r!(n-r)!}'
        },
        { type:'ingredients', heading:'Key Formulae', items:[
          { iconText:'P', color:'cyan', label:'Permutations', formula:'{}^{n}P_{r}=\\dfrac{n!}{(n-r)!}', desc:'Order matters — arrangements' },
          { iconText:'C', color:'green', label:'Combinations', formula:'{}^{n}C_{r}=\\dfrac{n!}{r!(n-r)!}', desc:'Order doesn’t matter — selections' },
          { iconText:'?', color:'pink', label:'Spotting Which to Use', desc:'Ask: would swapping two chosen items give a genuinely different outcome?' }
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Permutations Example', icon:'calculator', color:'amber', steps:[
            { title:'Identify n and r', desc:'e.g. how many ways can 3 of 8 runners finish 1st, 2nd, 3rd?', formula:'$n=8,\\ r=3$ — order matters (positions differ)' },
            { title:'Substitute into the formula', desc:'', formula:'${}^{8}P_{3}=\\dfrac{8!}{5!}$' },
            { title:'Evaluate', desc:'', formula:'<span class="np-highlight">$8\\times7\\times6=336$</span>' }
          ]},
          { type:'cardgroup', heading:'Arranging with Repeats', cards:[
            { iconText:'!!', color:'violet', title:'Repeated Objects', desc:'Divide by the factorial of each repeated group, to avoid overcounting.', example:{ from:'\\text{arrangements of AABB}', to:'\\dfrac{4!}{2!\\,2!}=6' } }
          ]}
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Combinations Example', icon:'calculator', color:'amber', steps:[
            { title:'Identify n and r', desc:'e.g. how many ways can a team of 3 be chosen from 8 players?', formula:'$n=8,\\ r=3$ — order doesn’t matter (a team is a team)' },
            { title:'Substitute into the formula', desc:'', formula:'${}^{8}C_{3}=\\dfrac{8!}{3!\\,5!}$' },
            { title:'Evaluate', desc:'', formula:'<span class="np-highlight">$56$</span>' }
          ]},
          { type:'cardgroup', heading:'Combining With Conditions', cards:[
            { iconText:'+', color:'teal', title:'Splitting into Cases', desc:'For “at least” or “exactly” conditions, count each case separately, then add.', example:{ from:'\\text{at least 1 girl, team of 3}', to:'\\text{total}-\\text{all boys}' } }
          ]}
        ]},
                { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
          question:'A committee of 5 is chosen from 7 teachers and 6 students, with at least 3 teachers required. Find the number of possible committees.',
          steps:[
            { title:'Exactly 3 teachers', desc:'Choose 3 of the 7 teachers, and the remaining 2 spots from the 6 students',
              formula:'$\\binom{7}{3}\\binom{6}{2}=35\\times15=525$' },
            { title:'Exactly 4 teachers', desc:'Choose 4 of the 7 teachers, and the remaining 1 spot from the students',
              formula:'$\\binom{7}{4}\\binom{6}{1}=35\\times6=210$' },
            { title:'Exactly 5 teachers', desc:'Choose all 5 from the teachers, leaving none for the students',
              formula:'$\\binom{7}{5}\\binom{6}{0}=21\\times1=21$' },
            { title:'Add the cases', desc:'Since these three cases are mutually exclusive (a committee can’t have exactly 3, 4 and 5 teachers at once), add them together',
              formula:'<span class="np-highlight">$525+210+21=756$</span>' }
          ]
        },
        { type:'remember', text:'If reordering the selected items would create a genuinely different outcome (like a race finish or a PIN), use ${}^{n}P_{r}$; if it wouldn’t (like a team or a hand of cards), use ${}^{n}C_{r}$.' },
        { type:'practice', text:'Try questions on permutations and combinations.', href:'maths-question-bank.html#qb=1.7.2' }
      ]
    }
  ] },
  { num:'1.8', title:'Complex Numbers', subs:[
    { num:'1.8.1', title:'Intro to Complex Numbers',
      blocks:[
        { type:'intro', icon:'zap', color:'violet',
          text:'A complex number extends the real numbers by introducing $i$, the square root of $-1$, allowing equations like $x^{2}=-1$ to have solutions.',
          formula:'z=a+bi,\\qquad i^{2}=-1'
        },
        { type:'ingredients', heading:'Key Ingredients', items:[
          { iconText:'a', color:'cyan', label:'Real Part', formula:'\\text{Re}(z)=a', desc:'The non-imaginary component' },
          { iconText:'b', color:'green', label:'Imaginary Part', formula:'\\text{Im}(z)=b', desc:'The (real) coefficient of i' },
          { iconText:'i', color:'pink', label:'Imaginary Unit', formula:'i=\\sqrt{-1}', desc:'Defined so that $i^{2}=-1$' }
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Adding and Subtracting', icon:'calculator', color:'amber', steps:[
            { title:'Group real and imaginary parts', desc:'e.g. $(3+2i)+(1-5i)$', formula:'reals: $3+1$, imaginaries: $2i-5i$' },
            { title:'Combine each group', desc:'', formula:'<span class="np-highlight">$4-3i$</span>' }
          ]},
          { type:'cardgroup', heading:'Powers of i', cards:[
            { iconText:'i&sup2;', color:'violet', title:'Cycle of 4', desc:'Powers of i repeat every 4th power.', example:{ from:'i^{1},i^{2},i^{3},i^{4}', to:'i,-1,-i,1' } }
          ]}
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Multiplying Complex Numbers', icon:'calculator', color:'amber', steps:[
            { title:'Expand like brackets', desc:'e.g. $(2+3i)(1-4i)$', formula:'$2-8i+3i-12i^{2}$' },
            { title:'Replace i² with -1', desc:'', formula:'$2-8i+3i-12(-1)$' },
            { title:'Simplify', desc:'', formula:'<span class="np-highlight">$14-5i$</span>' }
          ]},
          { type:'cardgroup', heading:'Complex Conjugate', cards:[
            { iconText:'z&#772;', color:'teal', title:'Definition', desc:'Flip the sign of the imaginary part.', example:{ from:'z=a+bi', to:'\\bar z=a-bi' } }
          ]}
        ]},
                { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
          question:'Solve $z^{2}-6z+13=0$ for $z$, and verify your solutions by substitution.',
          steps:[
            { title:'Apply the quadratic formula', desc:'Use $z=\\dfrac{-b\\pm\\sqrt{b^{2}-4ac}}{2a}$ with $a=1,\\ b=-6,\\ c=13$',
              formula:'$z=\\dfrac{6\\pm\\sqrt{36-52}}{2}=\\dfrac{6\\pm\\sqrt{-16}}{2}$' },
            { title:'Simplify the square root of a negative', desc:'Since $\\sqrt{-16}=\\sqrt{16}\\times\\sqrt{-1}=4i$',
              formula:'$z=\\dfrac{6\\pm4i}{2}=3\\pm2i$' },
            { title:'Verify by substitution', desc:'try $z=3+2i$',
              formula:'$(3+2i)^{2}-6(3+2i)+13=(5+12i)-(18+12i)+13$' },
            { title:'Confirm it equals zero', desc:'Combine the real parts and the imaginary parts separately',
              formula:'<span class="np-highlight">$=0$ &#10003;</span>' }
          ]
        },
        { type:'remember', text:'Two complex numbers are equal only if both their real parts match and their imaginary parts match — one equation in complex numbers is really two equations in disguise.' },
        { type:'practice', text:'Try questions on complex number arithmetic.', href:'maths-question-bank.html#qb=1.8.1' }
      ]
    },
    { num:'1.8.2', title:'Modulus &amp; Argument',
      blocks:[
        { type:'intro', icon:'zap', color:'violet',
          text:'The modulus measures how far a complex number is from the origin, and the argument measures the angle it makes — together they locate z on the Argand plane.',
          formula:'|z|=\\sqrt{a^{2}+b^{2}},\\qquad \\arg(z)=\\theta'
        },
        { type:'ingredients', heading:'Key Ingredients', items:[
          { iconText:'|z|', color:'cyan', label:'Modulus', formula:'|z|=\\sqrt{a^{2}+b^{2}}', desc:'The distance from the origin' },
          { iconText:'&theta;', color:'green', label:'Argument', formula:'\\arg(z)=\\arctan\\left(\\dfrac{b}{a}\\right)', desc:'Angle from the positive real axis' },
          { iconText:'&plusmn;&pi;', color:'pink', label:'Principal Argument', desc:'Conventionally given in the range $-\\pi<\\theta\\le\\pi$' }
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Finding the Modulus &amp; Argument', icon:'calculator', color:'amber', steps:[
            { title:'Identify a and b', desc:'e.g. find the modulus and argument of $z=1+\\sqrt3\\,i$', formula:'$a=1,\\ b=\\sqrt3$' },
            { title:'Calculate the modulus', desc:'', formula:'$|z|=\\sqrt{1+3}=2$' },
            { title:'Calculate the argument', desc:'check the quadrant — here $a,b>0$, so 1st quadrant', formula:'<span class="np-highlight">$\\arg(z)=\\arctan(\\sqrt3)=\\dfrac{\\pi}{3}$</span>' }
          ]},
          { type:'cardgroup', heading:'Checking the Quadrant', cards:[
            { iconText:'Q', color:'violet', title:'Why It Matters', desc:'A calculator’s arctan only gives angles in quadrants 1 and 4 — adjust by $\\pm\\pi$ if $a<0$.', example:{ from:'a<0,\\ b>0', to:'\\theta=\\pi+\\arctan(b/a)' } }
          ]}
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Modulus of Products &amp; Quotients', icon:'calculator', color:'amber', steps:[
            { title:'Multiply/divide the moduli', desc:'e.g. find $|z_{1}z_{2}|$ if $|z_{1}|=3,\\ |z_{2}|=4$', formula:'$|z_{1}z_{2}|=|z_{1}||z_{2}|=12$' },
            { title:'Add/subtract the arguments', desc:'e.g. find $\\arg(z_{1}z_{2})$ if $\\arg z_{1}=\\tfrac{\\pi}{4},\\ \\arg z_{2}=\\tfrac{\\pi}{6}$', formula:'$\\arg(z_{1}z_{2})=\\arg z_{1}+\\arg z_{2}$' },
            { title:'Evaluate', desc:'', formula:'<span class="np-highlight">$\\dfrac{5\\pi}{12}$</span>' }
          ]},
          { type:'cardgroup', heading:'Division Rule', cards:[
            { iconText:'&divide;', color:'teal', title:'Dividing Complex Numbers', desc:'The modulus divides, and the argument subtracts.', example:{ from:'\\arg\\!\\left(\\dfrac{z_{1}}{z_{2}}\\right)', to:'\\arg z_{1}-\\arg z_{2}' } }
          ]}
        ]},
                { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
          question:'Given $z_1=1+i\\sqrt3$ and $z_2=\\sqrt3-i$, find $|z_1z_2|$ and $\\arg(z_1z_2)$ without multiplying $z_1$ and $z_2$ out directly.',
          steps:[
            { title:'Find the modulus and argument of each number', desc:'Sketching each point on an Argand diagram helps identify the correct quadrant for its argument',
              formula:'$|z_1|=2,\\ \\arg z_1=\\tfrac{\\pi}{3}$; &nbsp; $|z_2|=2,\\ \\arg z_2=-\\tfrac{\\pi}{6}$' },
            { title:'Multiply the moduli', desc:'When multiplying complex numbers, their moduli multiply together',
              formula:'$|z_1z_2|=2\\times2=4$' },
            { title:'Add the arguments', desc:'When multiplying complex numbers, their arguments add together',
              formula:'$\\arg(z_1z_2)=\\tfrac{\\pi}{3}-\\tfrac{\\pi}{6}$' },
            { title:'Simplify', desc:'Subtract the fractions to leave a single angle',
              formula:'<span class="np-highlight">$\\arg(z_1z_2)=\\dfrac{\\pi}{6}$</span>' }
          ]
        },
        { type:'remember', text:'Always sketch the point on an Argand diagram before finding the argument — it’s the fastest way to catch a quadrant mistake.' },
        { type:'practice', text:'Try questions on modulus and argument.', href:'maths-question-bank.html#qb=1.8.2' }
      ]
    },
    { num:'1.8.3', title:'Introduction to Argand Diagrams',
      blocks:[
        { type:'intro', icon:'zap', color:'violet',
          text:'An Argand diagram plots a complex number $a+bi$ as the point $(a,b)$ — the real part on the horizontal axis, the imaginary part on the vertical axis.',
          formula:'z=a+bi\\ \\longleftrightarrow\\ (a,b)'
        },
        { type:'ingredients', heading:'Key Ingredients', items:[
          { iconText:'Re', color:'cyan', label:'Real Axis', desc:'The horizontal axis — plots Re(z)' },
          { iconText:'Im', color:'green', label:'Imaginary Axis', desc:'The vertical axis — plots Im(z)' },
          { iconText:'|z|', color:'pink', label:'Vector from Origin', desc:'z can be represented as a directed line segment from the origin to $(a,b)$' }
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Plotting Complex Numbers', icon:'calculator', color:'amber', steps:[
            { title:'Read off the real and imaginary parts', desc:'e.g. plot $z=-2+3i$', formula:'$a=-2,\\ b=3$' },
            { title:'Plot the point', desc:'', formula:'<span class="np-highlight">point $(-2,3)$, in the 2nd quadrant</span>' }
          ]},
          { type:'cardgroup', heading:'Geometric Meaning of Conjugate', cards:[
            { iconText:'z&#772;', color:'violet', title:'Reflection in Real Axis', desc:'The conjugate is the reflection of z in the real axis.', example:{ from:'z=a+bi', to:'\\bar z=a-bi' } }
          ]}
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Adding Complex Numbers Geometrically', icon:'calculator', color:'amber', steps:[
            { title:'Treat each number as a vector', desc:'e.g. add $z_{1}=1+2i$ and $z_{2}=3-i$', formula:'add components: $(1+3)+(2-1)i$' },
            { title:'Use the parallelogram rule', desc:'geometrically, complete the parallelogram formed by the two vectors', formula:'<span class="np-highlight">$z_{1}+z_{2}=4+i$</span>' }
          ]},
          { type:'cardgroup', heading:'Loci in the Complex Plane', cards:[
            { iconText:'&#9675;', color:'teal', title:'Circle Locus', desc:'Points at a fixed distance from a fixed complex number form a circle.', example:{ from:'|z-(2+i)|=3', to:'\\text{circle, centre }(2,1),\\ r=3' } },
            { iconText:'&mdash;', color:'pink', title:'Line Locus', desc:'Points equidistant from two fixed complex numbers form the perpendicular bisector joining them.' }
          ]}
        ]},
                { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
          question:'Find the Cartesian equation of the locus $|z-3|=|z+1-2i|$.',
          steps:[
            { title:'Identify the two fixed points', desc:'The equation says z is equally distant from these two fixed complex numbers — the definition of a perpendicular bisector',
              formula:'the locus is the perpendicular bisector of $(3,0)$ and $(-1,2)$' },
            { title:'Find the midpoint', desc:'The perpendicular bisector always passes through the midpoint of the two points',
              formula:'$\\left(1,1\\right)$' },
            { title:'Find the perpendicular gradient', desc:'gradient of the segment is $-\\tfrac12$',
              formula:'perpendicular gradient $=2$' },
            { title:'Write the line equation', desc:'Use $y-y_1=m(x-x_1)$ with the midpoint and the perpendicular gradient',
              formula:'<span class="np-highlight">$y=2x-1$</span>' }
          ]
        },
        { type:'remember', text:'An Argand diagram turns algebra into geometry — addition becomes vector addition, and equations like $|z-z_{0}|=r$ become circles, which is often the fastest way to solve them.' },
        { type:'practice', text:'Try questions on Argand diagrams.', href:'maths-question-bank.html#qb=1.8.3' }
      ]
    }
  ] },
  { num:'1.9', title:'Further Complex Numbers', subs:[
    { num:'1.9.1', title:'Geometry of Complex Numbers',
      blocks:[
        { type:'intro', icon:'zap', color:'violet',
          text:'Multiplying and dividing complex numbers has a geometric meaning on the Argand diagram: it rotates and scales points about the origin.',
          formula:'z_{1}z_{2}\\ \\text{rotates } z_{1} \\text{ by } \\arg(z_{2}) \\text{ and scales by } |z_{2}|'
        },
        { type:'ingredients', heading:'Key Ideas', items:[
          { iconText:'&times;i', color:'cyan', label:'Multiplying by i', desc:'Rotates a point 90&deg; anticlockwise about the origin' },
          { iconText:'&times;k', color:'green', label:'Multiplying by Real k', desc:'Scales the distance from the origin by a factor of k, with no rotation' },
          { iconText:'&times;z', color:'pink', label:'Multiplying by Any z', desc:'Rotates by $\\arg(z)$ and scales by $|z|$' }
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Rotating a Point by 90&deg;', icon:'calculator', color:'amber', steps:[
            { title:'Multiply by i', desc:'e.g. rotate $z=3+2i$ by 90&deg; anticlockwise about the origin', formula:'$iz=i(3+2i)=3i+2i^{2}$' },
            { title:'Simplify using i² = -1', desc:'', formula:'<span class="np-highlight">$=-2+3i$</span>' }
          ]},
          { type:'cardgroup', heading:'Rotating by Other Angles', cards:[
            { iconText:'&theta;', color:'violet', title:'General Rotation', desc:'Multiplying by $\\cos\\theta+i\\sin\\theta$ rotates a point by $\\theta$ about the origin.', example:{ from:'z(\\cos\\theta+i\\sin\\theta)', to:'\\text{rotation by }\\theta' } }
          ]}
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Vectors Between Two Points', icon:'calculator', color:'amber', steps:[
            { title:'Subtract the complex numbers', desc:'e.g. find the vector from $z_{1}=1+i$ to $z_{2}=4+5i$', formula:'$z_{2}-z_{1}=(4-1)+(5-1)i$' },
            { title:'Interpret geometrically', desc:'', formula:'<span class="np-highlight">$3+4i$, length $|z_{2}-z_{1}|=5$</span>' }
          ]},
          { type:'cardgroup', heading:'Using Geometry to Solve Problems', cards:[
            { iconText:'&#9651;', color:'teal', title:'Shapes from Complex Numbers', desc:'Equal side lengths (moduli of differences) can confirm a triangle is isosceles or equilateral.' }
          ]}
        ]},
                { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
          question:'Points $z_1=1+i$ and $z_3=7+i$ are two vertices of an equilateral triangle, with $z_2$ obtained by rotating $z_3$ about $z_1$ through $60°$. Find $z_2$.',
          steps:[
            { title:'Find the vector from z1 to z3', desc:'This represents the side of the triangle that will be rotated',
              formula:'$z_3-z_1=6$' },
            { title:'Rotate this vector by 60°', desc:'Multiplying by $\\cos60°+i\\sin60°$ rotates a vector by 60° anticlockwise, without changing its length',
              formula:'$6(0.5+0.866i)=3+5.196i$' },
            { title:'Add back to z1', desc:'The rotated vector needs to be added back onto the point it was rotated about',
              formula:'$z_2=z_1+(3+5.196i)$' },
            { title:'Simplify', desc:'Add the real and imaginary parts separately',
              formula:'<span class="np-highlight">$z_2\\approx4+6.20i$</span>' }
          ]
        },
        { type:'remember', text:'Rotation about the origin always comes from multiplication, not addition — adding a complex number is a translation (a shift), not a rotation.' },
        { type:'practice', text:'Try questions on the geometry of complex numbers.', href:'maths-question-bank.html#qb=1.9.1' }
      ]
    },
    { num:'1.9.2', title:'Forms of Complex Numbers',
      blocks:[
        { type:'intro', icon:'zap', color:'violet',
          text:'Besides Cartesian form $a+bi$, a complex number can be written in polar or exponential form, which make multiplication, division and powers far easier.',
          formula:'z=r(\\cos\\theta+i\\sin\\theta)=re^{i\\theta}'
        },
        { type:'ingredients', heading:'Key Forms', items:[
          { iconText:'a+bi', color:'cyan', label:'Cartesian Form', desc:'Best for adding and subtracting' },
          { iconText:'r,&theta;', color:'green', label:'Polar Form', formula:'z=r(\\cos\\theta+i\\sin\\theta)', desc:'Best for visualising modulus and argument' },
          { iconText:'e', color:'pink', label:'Exponential (Euler) Form', formula:'z=re^{i\\theta}', desc:'Best for multiplying, dividing and raising to powers' }
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Cartesian to Polar/Exponential', icon:'calculator', color:'amber', steps:[
            { title:'Find r and θ', desc:'e.g. convert $z=-1+\\sqrt3\\,i$', formula:'$r=|z|=2,\\ \\theta=\\arg z=\\dfrac{2\\pi}{3}$' },
            { title:'Write in polar form', desc:'', formula:'$z=2\\left(\\cos\\dfrac{2\\pi}{3}+i\\sin\\dfrac{2\\pi}{3}\\right)$' },
            { title:'Write in exponential form', desc:'', formula:'<span class="np-highlight">$z=2e^{i2\\pi/3}$</span>' }
          ]},
          { type:'cardgroup', heading:'Euler’s Formula', cards:[
            { iconText:'e&#8305;&theta;', color:'violet', title:'The Identity', desc:'Connects exponentials to trigonometry: $e^{i\\theta}=\\cos\\theta+i\\sin\\theta$.' }
          ]}
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Polar/Exponential to Cartesian', icon:'calculator', color:'amber', steps:[
            { title:'Identify r and θ', desc:'e.g. convert $z=4e^{i\\pi/6}$', formula:'$r=4,\\ \\theta=\\dfrac{\\pi}{6}$' },
            { title:'Evaluate cos and sin', desc:'', formula:'$4\\left(\\dfrac{\\sqrt3}{2}+i\\dfrac12\\right)$' },
            { title:'Simplify', desc:'', formula:'<span class="np-highlight">$2\\sqrt3+2i$</span>' }
          ]},
          { type:'cardgroup', heading:'Multiplying in Exponential Form', cards:[
            { iconText:'&times;', color:'teal', title:'Why It’s Easier', desc:'Multiplying just adds the exponents — no expanding brackets needed.', example:{ from:'r_{1}e^{i\\theta_{1}}\\times r_{2}e^{i\\theta_{2}}', to:'r_{1}r_{2}\\,e^{i(\\theta_{1}+\\theta_{2})}' } }
          ]}
        ]},
                { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
          question:'Given $z=1-i$, find $z^{10}$ in the form $a+bi$, using exponential form.',
          steps:[
            { title:'Convert to exponential form', desc:'Find the modulus and argument of z first',
              formula:'$z=\\sqrt2\\,e^{-i\\pi/4}$' },
            { title:'Raise to the power 10', desc:'Raising to a power in exponential form is much simpler: raise the modulus to the power, and multiply the argument by the power',
              formula:'$z^{10}=(\\sqrt2)^{10}e^{-i10\\pi/4}=32e^{-i5\\pi/2}$' },
            { title:'Reduce the angle', desc:'subtract $2\\pi$',
              formula:'$-\\dfrac{5\\pi}{2}+2\\pi=-\\dfrac{\\pi}{2}$' },
            { title:'Convert back to Cartesian form', desc:'Evaluate cos and sin at the simplified angle',
              formula:'<span class="np-highlight">$32\\left(\\cos\\left(-\\tfrac{\\pi}{2}\\right)+i\\sin\\left(-\\tfrac{\\pi}{2}\\right)\\right)=-32i$</span>' }
          ]
        },
        { type:'remember', text:'Exponential form turns multiplication and division of complex numbers into addition and subtraction of angles — always convert to this form before raising a complex number to a power.' },
        { type:'practice', text:'Try questions on the forms of complex numbers.', href:'maths-question-bank.html#qb=1.9.2' }
      ]
    },
    { num:'1.9.3', title:'Complex Roots of Polynomials',
      blocks:[
        { type:'intro', icon:'zap', color:'violet',
          text:'Polynomials with real coefficients can have complex roots, and these roots always come in conjugate pairs.',
          formula:'ax^{2}+bx+c=0,\\ b^{2}-4ac<0 \\implies x=\\dfrac{-b\\pm i\\sqrt{4ac-b^{2}}}{2a}'
        },
        { type:'ingredients', heading:'Key Facts', items:[
          { iconText:'z&#772;', color:'cyan', label:'Conjugate Root Theorem', desc:'If z is a root of a polynomial with real coefficients, so is $\\bar z$' },
          { iconText:'n', color:'green', label:'Fundamental Theorem of Algebra', desc:'A degree-n polynomial has exactly n roots (counting multiplicity and complex roots)' },
          { iconText:'&Delta;<0', color:'pink', label:'Discriminant', formula:'b^{2}-4ac<0', desc:'Signals complex (non-real) roots for a quadratic' }
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Solving a Quadratic with Complex Roots', icon:'calculator', color:'amber', steps:[
            { title:'Check the discriminant', desc:'e.g. solve $x^{2}-4x+13=0$', formula:'$\\Delta=16-52=-36<0$' },
            { title:'Use the quadratic formula', desc:'', formula:'$x=\\dfrac{4\\pm\\sqrt{-36}}{2}$' },
            { title:'Rewrite the square root of a negative', desc:'', formula:'<span class="np-highlight">$x=2\\pm3i$</span>' }
          ]},
          { type:'cardgroup', heading:'Conjugate Pairs', cards:[
            { iconText:'&plusmn;', color:'violet', title:'Always in Pairs', desc:'Complex roots of a real polynomial never appear alone.', example:{ from:'2+3i\\text{ is a root}', to:'2-3i\\text{ is also a root}' } }
          ]}
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Finding a Cubic from Its Roots', icon:'calculator', color:'amber', steps:[
            { title:'List all the roots', desc:'e.g. a real cubic has roots $2$ and $1+i$', formula:'the conjugate $1-i$ must also be a root' },
            { title:'Write as a product of factors', desc:'', formula:'$(x-2)(x-(1+i))(x-(1-i))$' },
            { title:'Multiply the complex conjugate pair first', desc:'', formula:'<span class="np-highlight">$(x-2)(x^{2}-2x+2)$</span>' }
          ]},
          { type:'cardgroup', heading:'Sum &amp; Product of Roots', cards:[
            { iconText:'&Sigma;', color:'teal', title:'Vieta’s Formulas', desc:'Still apply even when some roots are complex.', example:{ from:'ax^{2}+bx+c', to:'\\text{sum}=-b/a,\\ \\text{product}=c/a' } }
          ]}
        ]},
                { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
          question:'Given that $2i$ is a root of $x^{4}-3x^{3}+6x^{2}-12x+8=0$, find all four roots of the equation.',
          steps:[
            { title:'State the conjugate root', desc:'The conjugate root theorem guarantees this, since the polynomial has real coefficients',
              formula:'$-2i$ is also a root' },
            { title:'Form the quadratic factor', desc:'Multiplying a complex conjugate pair of roots always gives a quadratic with real coefficients',
              formula:'$(x-2i)(x+2i)=x^{2}+4$' },
            { title:'Divide the quartic by this factor', desc:'Since $x^{2}+4$ is a factor of the quartic, dividing gives the remaining quadratic factor',
              formula:'$x^{4}-3x^{3}+6x^{2}-12x+8=(x^{2}+4)(x^{2}-3x+2)$' },
            { title:'Factorise the quotient', desc:'Look for two numbers that multiply to 2 and add to $-3$: these are $-1$ and $-2$',
              formula:'$x^{2}-3x+2=(x-1)(x-2)$' },
            { title:'State all four roots', desc:'Combine the two real roots from the quotient with the two complex roots found earlier',
              formula:'<span class="np-highlight">$x=1,\\ 2,\\ 2i,\\ -2i$</span>' }
          ]
        },
        { type:'remember', text:'The conjugate root theorem only applies when the polynomial has real coefficients — always check this before assuming the conjugate is also a root.' },
        { type:'practice', text:'Try questions on complex roots of polynomials.', href:'maths-question-bank.html#qb=1.9.3' }
      ]
    },
    { num:'1.9.4', title:"De Moivre's Theorem",
      blocks:[
        { type:'intro', icon:'zap', color:'violet',
          text:'De Moivre’s theorem gives a shortcut for raising a complex number in polar form to a power, without repeated multiplication.',
          formula:'[r(\\cos\\theta+i\\sin\\theta)]^{n}=r^{n}(\\cos n\\theta+i\\sin n\\theta)'
        },
        { type:'ingredients', heading:'Key Ingredients', items:[
          { iconText:'r&#8319;', color:'cyan', label:'Modulus Raised', formula:'r^{n}', desc:'The modulus is raised to the power n' },
          { iconText:'n&theta;', color:'green', label:'Argument Multiplied', formula:'n\\theta', desc:'The argument is multiplied by n' },
          { iconText:'&#8484;', color:'pink', label:'Valid for Any Integer n', desc:'Works for positive, negative, and $n=0$' }
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Raising to a Power', icon:'calculator', color:'amber', steps:[
            { title:'Convert to polar form', desc:'e.g. find $(1+i)^{8}$', formula:'$1+i=\\sqrt2\\left(\\cos\\dfrac{\\pi}{4}+i\\sin\\dfrac{\\pi}{4}\\right)$' },
            { title:'Apply De Moivre’s theorem', desc:'', formula:'$(\\sqrt2)^{8}\\left(\\cos\\dfrac{8\\pi}{4}+i\\sin\\dfrac{8\\pi}{4}\\right)$' },
            { title:'Simplify', desc:'', formula:'<span class="np-highlight">$16(\\cos2\\pi+i\\sin2\\pi)=16$</span>' }
          ]},
          { type:'cardgroup', heading:'Proof Sketch (by Induction)', cards:[
            { iconText:'n=1', color:'violet', title:'Base Case', desc:'True trivially for $n=1$.' },
            { iconText:'k&rarr;k+1', color:'teal', title:'Inductive Step', desc:'Uses the compound angle formulas for cos and sin to go from $n=k$ to $n=k+1$.' }
          ]}
        ]},
        { type:'columns', items:[
          { type:'steps', heading:'Using De Moivre for Trig Identities', icon:'calculator', color:'amber', steps:[
            { title:'Expand (cosθ + isinθ)ⁿ with the binomial theorem', desc:'e.g. derive an identity for $\\cos3\\theta$', formula:'$\\cos3\\theta+i\\sin3\\theta=(\\cos\\theta+i\\sin\\theta)^{3}$' },
            { title:'Expand the right-hand side', desc:'', formula:'$\\cos^{3}\\theta+3i\\cos^{2}\\theta\\sin\\theta-3\\cos\\theta\\sin^{2}\\theta-i\\sin^{3}\\theta$' },
            { title:'Equate real parts', desc:'', formula:'<span class="np-highlight">$\\cos3\\theta=\\cos^{3}\\theta-3\\cos\\theta\\sin^{2}\\theta$</span>' }
          ]},
          { type:'cardgroup', heading:'Negative Powers', cards:[
            { iconText:'1/z', color:'pink', title:'Also Valid', desc:'De Moivre’s theorem extends to negative integer powers too.', example:{ from:'z^{-n}', to:'r^{-n}(\\cos n\\theta-i\\sin n\\theta)' } }
          ]}
        ]},
                { type:'steps', heading:'Worked Example', icon:'calculator', color:'amber', handwritten:true,
          question:'Use De Moivre’s theorem to show that $\\tan3\\theta=\\dfrac{3\\tan\\theta-\\tan^{3}\\theta}{1-3\\tan^{2}\\theta}$.',
          steps:[
            { title:'Apply De Moivre’s theorem', desc:'This lets us expand $\\cos3\\theta+i\\sin3\\theta$ using ordinary algebra instead of trigonometric identities',
              formula:'$\\cos3\\theta+i\\sin3\\theta=(\\cos\\theta+i\\sin\\theta)^{3}$' },
            { title:'Expand using the binomial theorem', desc:'and equate real and imaginary parts',
              formula:'$\\cos3\\theta=\\cos^{3}\\theta-3\\cos\\theta\\sin^{2}\\theta,\\quad \\sin3\\theta=3\\cos^{2}\\theta\\sin\\theta-\\sin^{3}\\theta$' },
