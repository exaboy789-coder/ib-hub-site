<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<script>
  (function(){
    var stored = localStorage.getItem('ib-hub-theme');
    var theme = stored || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<title>Revision Notes — Mathematics AA HL — IB Subjects Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="theme.css">
<style>
  .term-panel,.note-card,.search-box,.topbar,.quicknav a{transition:background-color .25s ease, border-color .25s ease, box-shadow .25s ease;}
  html{scroll-behavior:smooth; background-color:var(--bg); min-height:100%;}
  body{
    margin:0; min-height:100vh; background-color:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif; line-height:1.55;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--accent); font-weight:500;
  }
  h1,h2,h3{font-family:'Space Grotesk', sans-serif; font-weight:600; margin:0; color:var(--ink);}

  /* ---- top bar ---- */
  .topbar{border-bottom:1px solid var(--rule); background:rgba(var(--panel-rgb),0.88); backdrop-filter:blur(8px); position:sticky; top:0; z-index:20;}
  .topbar-inner{max-width:1080px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px;}
  .logo{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:17px; white-space:nowrap; letter-spacing:0.02em;}
  .logo span{color:var(--cyan);}
  .topbar-title{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); letter-spacing:0.1em; text-transform:uppercase; flex:1; text-align:center;}
  .topbar-actions{display:flex; align-items:center; gap:14px;}
  .search-box{display:flex; align-items:center; gap:8px; border:1.5px solid var(--rule); background:var(--panel); border-radius:999px; padding:9px 16px; transition:border-color .2s ease, box-shadow .2s ease;}
  .search-box:focus-within{border-color:var(--cyan); box-shadow:0 0 0 4px rgba(var(--cyan-rgb),0.12);}
  .search-box svg{width:14px;height:14px;flex-shrink:0;color:var(--ink-soft);}
  .search-box input{border:none; outline:none; background:transparent; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink); width:150px; caret-color:var(--cyan);}
  .search-box input::placeholder{color:#566182;}
  .topbar nav a{font-size:13px; text-decoration:none; color:var(--ink); font-weight:600; border:1.5px solid var(--rule); border-radius:999px; padding:9px 18px; transition:all .2s ease; background:var(--panel);}
  .topbar nav a:hover{border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 0 4px rgba(var(--cyan-rgb),0.1);}
  .theme-switch{background:linear-gradient(135deg, var(--cyan), var(--pink));}

  /* ---- friendly card ---- */
  .term-panel{position:relative; border:1px solid var(--rule); background:var(--panel); border-radius:20px; box-shadow:0 2px 10px rgba(20,20,30,0.04);}

  /* ---- breadcrumb ---- */
  .crumbbar{margin:36px 0 0; padding:14px 20px; display:flex; align-items:center; justify-content:space-between;}
  .crumb{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); text-decoration:none; display:flex; align-items:center; gap:10px;}
  .crumb b{color:var(--ink); font-weight:500;}
  .crumb:hover{color:var(--accent);}
  .copy-btn{
    border:1.5px solid var(--rule); background:none; color:var(--ink-soft); width:32px; height:32px; border-radius:999px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s ease;
  }
  .copy-btn:hover{border-color:var(--accent); color:var(--accent); box-shadow:0 0 12px rgba(var(--accent-rgb),0.25);}
  .copy-btn svg{width:14px;height:14px;}

  /* ---- hero ---- */
  .subject-hero{margin:18px 0 0; padding:34px 30px;}
  .subject-hero-row{display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
  .subject-glyph{
    width:64px; height:64px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-size:24px; font-weight:600;
    border-radius:18px; color:var(--accent);
    background:rgba(var(--accent-rgb),0.12);
  }
  .subject-hero h1{
    font-size:28px; line-height:1.2; color:var(--ink);
  }
  .subject-hero .tagline{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); margin-top:8px;}

  /* ---- topic quick-nav ---- */
  .quicknav{margin:18px 0 0; padding:14px 18px; display:flex; gap:8px; flex-wrap:wrap;}
  .quicknav a{
    font-family:'IBM Plex Sans',sans-serif; font-size:12.5px; font-weight:600;
    color:var(--ink-soft); text-decoration:none; border:1.5px solid var(--rule); border-radius:999px; padding:8px 14px; transition:all .2s ease;
  }
  .quicknav a:hover{color:var(--accent); border-color:var(--accent); box-shadow:0 0 10px rgba(var(--accent-rgb),0.2);}

  /* ---- filter ---- */
  .filter-row{margin:30px 0 0; display:flex; align-items:center; gap:12px;}
  .filter-row .search-box{flex:1;}
  .filter-row .search-box input{width:100%;}
  .filter-count{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); white-space:nowrap;}
  .fold-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:500; color:var(--ink-soft);
    background:none; border:1.5px solid var(--rule); border-radius:999px; padding:8px 14px; cursor:pointer;
    white-space:nowrap; transition:all .2s ease;
  }
  .fold-btn:hover{color:var(--accent); border-color:var(--accent);}

  /* ---- topic sections ---- */
  .topic-section{padding:46px 0 6px; scroll-margin-top:80px;}
  .topic-section.is-empty{display:none;}
  .topic-head{display:flex; align-items:center; gap:14px; margin-bottom:22px;}
  .topic-head .topic-dot{width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px rgba(var(--accent-rgb),0.6); flex-shrink:0;}
  .topic-head h2{font-size:21px;}
  .topic-head .topic-num{font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--accent); padding:4px 10px; background:rgba(var(--accent-rgb),0.1); border-radius:999px;}
  .topic-head .topic-rule{flex:1; height:1px; background:var(--rule);}

  .subtopic-grid{display:flex; flex-direction:column; gap:12px;}
  .subtopic-block{overflow:hidden;}
  .subtopic-block.is-empty{display:none;}
  .subtopic-label{display:flex; align-items:center; gap:12px; margin:0; padding:15px 18px; cursor:pointer; user-select:none;}
  .subtopic-label:hover{background:rgba(var(--accent-rgb),0.05);}
  .subtopic-arrow{width:13px; height:13px; flex-shrink:0; color:var(--ink-soft); transition:transform .2s ease, color .2s ease;}
  .subtopic-label:hover .subtopic-arrow{color:var(--accent);}
  .subtopic-num{font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--accent); flex-shrink:0;}
  .subtopic-title{font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600; color:var(--ink); flex:1;}
  .subtopic-count{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; color:var(--accent);
    background:rgba(var(--accent-rgb),0.12); border-radius:999px; padding:3px 10px; flex-shrink:0;
  }
  .subtopic-block:not(.is-collapsed) .subtopic-arrow{transform:rotate(180deg);}

  .subtopic-content{display:grid; grid-template-rows:0fr; transition:grid-template-rows .25s ease;}
  .subtopic-block:not(.is-collapsed) .subtopic-content,
  .subtopic-block.force-expand .subtopic-content{grid-template-rows:1fr;}
  .subtopic-content-inner{overflow:hidden;}
  .note-grid{display:flex; flex-wrap:wrap; gap:10px; padding:2px 18px 18px;}
  .note-card{
    display:flex; align-items:center; gap:8px; padding:9px 15px; border-radius:12px;
    text-decoration:none; color:var(--ink); cursor:default; background:var(--panel-soft); border:1px solid transparent;
  }
  .note-card:hover{border-color:var(--accent); box-shadow:0 6px 14px rgba(var(--accent-rgb),0.15); transform:translateY(-1px);}
  .note-card .note-num{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:var(--accent); flex-shrink:0;}
  .note-card .note-title{font-family:'IBM Plex Sans',sans-serif; font-size:13px; font-weight:500;}
  .note-item.is-hidden{display:none;}

  /* ---- rich interactive note: click a pill tab to open its own page ---- */
  .note-tab{
    font-family:inherit; -webkit-appearance:none; appearance:none; cursor:pointer;
    transition:border-color .15s ease, box-shadow .15s ease, background-color .15s ease, transform .15s ease;
  }
  .note-tab:hover{transform:translateY(-1px); border-color:var(--accent);}

  .note-panel{display:none;}
  .note-panel.is-active{display:block;}

  /* ---- dedicated note "page" (opens when a tab pill is clicked) ---- */
  .note-page{display:none;}
  .note-page.show{display:block; margin-top:28px;}
  .note-page-back{
    display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:13px;
    color:var(--ink-soft); background:none; border:none; cursor:pointer; padding:0; margin-bottom:20px; transition:color .15s ease;
  }
  .note-page-back:hover{color:var(--accent);}
  .note-page-back svg{width:14px; height:14px;}

  .note-page-header{display:flex; align-items:center; gap:16px; margin-bottom:22px;}
  .note-page-badge{
    width:52px; height:52px; flex-shrink:0; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:700; color:var(--accent);
    background:rgba(var(--accent-rgb),0.14);
  }
  .note-page-titles{display:flex; flex-direction:column; gap:4px;}
  .note-page-eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); letter-spacing:0.04em;}
  .note-page-title{font-size:24px;}
  .note-page-body{display:block;}


  /* ---- visual note blocks (Revision-Village-style cards) ---- */
  .np-intro{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:22px 24px; margin-bottom:20px;
    background:var(--panel); border:1px solid var(--rule); border-radius:16px;
  }
  .np-intro-text{flex:1; min-width:200px; font-family:'IBM Plex Sans',sans-serif; font-size:14px; color:var(--ink); line-height:1.6; margin:0;}
  .np-intro-formula{font-size:1.5em; flex-shrink:0; margin-left:auto;}

  .np-icon-circle{
    width:44px; height:44px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:rgba(var(--c-rgb),0.16); color:var(--c); font-family:'Space Grotesk',sans-serif; font-style:italic; font-weight:700; font-size:17px;
  }
  .np-icon-circle svg{width:20px; height:20px;}
  .np-icon-circle-sm{width:32px; height:32px; font-size:14px;}
  .np-icon-circle-sm svg{width:15px; height:15px;}

  .np-card{padding:22px 24px 24px; margin-bottom:20px; background:var(--panel); border:1px solid var(--rule); border-radius:16px;}
  .np-card-heading{font-size:15px; margin:0 0 16px; display:flex; align-items:center; gap:10px;}
  .np-card-icon{
    width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    background:rgba(var(--c-rgb),0.16); color:var(--c);
  }
  .np-card-icon svg{width:15px; height:15px;}

  .np-ingredients-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:14px;}
  .np-ingredient{padding:16px 16px 18px; border-radius:14px; background:rgba(var(--c-rgb),0.06); border:1px solid rgba(var(--c-rgb),0.22);}
  .np-ingredient-label{font-family:'Space Grotesk',sans-serif; font-size:13.5px; font-weight:600; color:var(--c); margin:10px 0 6px;}
  .np-ingredient-formula{margin:0 0 4px; overflow-x:auto; padding-bottom:2px;}
  .np-ingredient-desc{font-family:'IBM Plex Sans',sans-serif; font-size:12px; color:var(--ink-soft); margin:0;}

  /* list variant: for entries with longer formulas, avoid an uneven trailing row */
  .np-ingredients-grid.is-list{grid-template-columns:1fr; gap:10px;}
  .np-ingredients-grid.is-list .np-ingredient{display:flex; align-items:center; gap:16px; padding:14px 18px;}
  .np-ingredients-grid.is-list .np-ingredient-label{margin:0 0 4px;}
  .np-ingredients-grid.is-list .np-ingredient-text{flex:1; min-width:0;}

  .np-columns{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;}
  .np-columns .np-card{margin-bottom:0;}

  .np-subcard{padding:16px 18px 18px; border-radius:14px; background:rgba(var(--c-rgb),0.06); border:1px solid rgba(var(--c-rgb),0.22); margin-bottom:14px;}
  .np-subcard:last-child{margin-bottom:0;}
  .np-subcard-head{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .np-subcard-title{font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; color:var(--c); margin:0;}
  .np-subcard-desc{font-family:'IBM Plex Sans',sans-serif; font-size:12px; color:var(--ink-soft); margin:2px 0 0;}

  .np-example{
    display:flex; align-items:center; justify-content:center; gap:14px; padding:14px 16px; margin-bottom:12px;
    background:var(--panel-soft); border-radius:10px; font-size:15px; color:var(--ink); text-align:center;
  }
  .np-example-arrow{color:var(--ink-soft); font-size:1.1em; flex-shrink:0;}
  .np-example .np-highlight .katex{color:var(--c);}

  .np-mini-steps{display:flex; flex-direction:column; gap:8px;}
  .np-mini-step{display:flex; align-items:baseline; gap:10px; font-family:'IBM Plex Sans',sans-serif; font-size:12.5px; color:var(--ink-soft);}
  .np-mini-num{
    width:18px; height:18px; border-radius:50%; background:rgba(var(--c-rgb),0.18); color:var(--c);
    display:inline-flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; flex-shrink:0;
  }

  .np-we-question{
    font-family:'IBM Plex Sans',sans-serif; font-size:14px; color:var(--ink); line-height:1.6;
    margin:0 0 18px; padding-bottom:16px; border-bottom:1px dashed var(--rule);
  }
  .np-steps{display:flex; flex-direction:column; gap:16px;}

  /* ---- "handwritten on paper" look for a worked-example's working-out ---- */
  .np-steps.is-handwritten{
    background:#FBF3D9; border-radius:12px; padding:22px 24px; gap:14px;
    transform:rotate(-0.4deg); box-shadow:0 6px 18px rgba(0,0,0,0.16);
  }
  .np-steps.is-handwritten .np-step-num{
    background:none; border:2px solid #2B2618; color:#2B2618; font-family:'Kalam',cursive; font-weight:700;
  }
  .np-steps.is-handwritten .np-step-title{
    font-family:'Kalam',cursive; font-size:16px; font-weight:700; color:#1E3A5F; margin:0 0 2px;
  }
  .np-steps.is-handwritten .np-step-desc{
    font-family:'Kalam',cursive; font-size:13.5px; color:#4a4232;
  }
  .np-steps.is-handwritten .np-step-formula{background:none; padding:6px 0 0;}
  .np-steps.is-handwritten .np-step-formula .katex,
  .np-steps.is-handwritten .np-step-formula .katex *{
    font-family:'Kalam',cursive !important; color:#1E3A5F !important;
  }
  .np-step{display:flex; gap:14px;}
  .np-step-num{
    width:28px; height:28px; border-radius:50%; background:var(--c); color:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:700;
  }
  .np-step-body{flex:1; min-width:0;}
  .np-step-title{font-family:'Space Grotesk',sans-serif; font-size:13.5px; font-weight:600; color:var(--c); margin:0 0 4px;}
  .np-step-desc{font-family:'IBM Plex Sans',sans-serif; font-size:12.5px; color:var(--ink-soft); margin:0 0 8px;}
  .np-step-formula{padding:10px 14px; background:var(--panel-soft); border-radius:9px; font-size:13.5px; overflow-x:auto;}
  .np-highlight{color:var(--c); font-weight:700;}
  .np-highlight .katex{color:var(--c);}

  .np-remember{
    display:flex; align-items:center; gap:16px; padding:18px 22px; margin-bottom:20px;
    background:rgba(var(--cyan-rgb),0.07); border:1px solid rgba(var(--cyan-rgb),0.25); border-radius:16px;
  }
  .np-remember .np-icon-circle{--c:var(--cyan); --c-rgb:var(--cyan-rgb);}
  .np-remember-body{flex:1; min-width:160px;}
  .np-remember-label{font-family:'Space Grotesk',sans-serif; font-size:13.5px; font-weight:700; color:var(--cyan); margin:0 0 4px;}
  .np-remember-body p:last-child{font-family:'IBM Plex Sans',sans-serif; font-size:12.5px; color:var(--ink-soft); margin:0; line-height:1.55;}
  .np-remember-deco{color:var(--cyan); opacity:.45; flex-shrink:0;}
  .np-remember-deco svg{width:26px; height:26px;}

  .np-practice{
    display:flex; align-items:center; gap:16px; padding:18px 22px; flex-wrap:wrap;
    background:rgba(var(--accent-rgb),0.07); border:1px solid rgba(var(--accent-rgb),0.25); border-radius:16px;
  }
  .np-practice .np-icon-circle{--c:var(--accent); --c-rgb:var(--accent-rgb);}
  .np-practice-body{flex:1; min-width:180px;}
  .np-practice-title{font-family:'Space Grotesk',sans-serif; font-size:13.5px; font-weight:700; color:var(--ink); margin:0 0 4px;}
  .np-practice-body p:last-child{font-family:'IBM Plex Sans',sans-serif; font-size:12.5px; color:var(--ink-soft); margin:0;}
  .np-practice-btn{
    display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Sans',sans-serif; font-size:13px; font-weight:600;
    color:#fff; background:var(--accent); border-radius:11px; padding:11px 20px; text-decoration:none; flex-shrink:0;
    transition:filter .2s ease;
  }
  .np-practice-btn:hover{filter:brightness(1.08);}
  .np-practice-btn svg{width:14px; height:14px;}

  @media (max-width:760px){
    .np-columns{grid-template-columns:1fr;}
    .np-intro{flex-direction:column; align-items:flex-start;}
    .np-intro-formula{margin-left:0;}
  }

  section.intro{padding:52px 0 0;}

  footer{padding:60px 0 56px; font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; text-align:center; letter-spacing:0.06em;}
  footer .status-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); margin-right:8px; animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}

  .no-results{display:none; text-align:center; padding:60px 0; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); font-size:13px;}
  .no-results.show{display:block;}

  @media (max-width:520px){
    .topbar-title{display:none;}
    .search-box input{width:90px;}
    .subject-hero h1{font-size:22px;}
    .filter-row .search-box input{width:auto;}
  }
  @media (prefers-reduced-motion: reduce){
    footer .status-dot{animation:none !important;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="logo">IB<span>::HUB</span></a>
    <div class="topbar-title">IB Subjects Hub</div>
    <div class="topbar-actions">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" placeholder="search_">
      </div>
      <nav><a href="#">Login</a></nav>
      <div class="theme-switch-wrap">
        <span class="theme-label" id="label-light">Light</span>
        <button class="theme-switch" id="theme-toggle" type="button" aria-label="Toggle dark mode">
          <span class="knob"></span><span class="switch-dot"></span>
        </button>
        <span class="theme-label" id="label-dark">Dark</span>
      </div>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="crumbbar term-panel">
    <a href="subject.html?s=maths&course=aa" class="crumb">&larr; Mathematics / <b>Revision Notes</b></a>
    <button class="copy-btn" id="copy-link" title="Copy link" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="1"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>
    </button>
