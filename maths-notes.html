// ---------- build the page ----------
var topicsEl = document.getElementById('topics');
var quicknav = document.getElementById('quicknav');
var totalAll = 0;
var qnHtml = '';
var notesByNum = {};

topics.forEach(function(topic){
  qnHtml += '<a href="#' + topic.id + '">' + topic.num + ' — ' + topic.label + '</a>';

  var section = document.createElement('div');
  section.className = 'topic-section';
  section.id = topic.id;
  section.style.setProperty('--accent', 'var(--' + topic.accent + ')');
  section.style.setProperty('--accent-rgb', 'var(--' + topic.accent + '-rgb)');

  var bodyHtml = '<div class="topic-head"><span class="topic-dot"></span><span class="topic-num">' + topic.num + '</span><h2>' + topic.label + '</h2><span class="topic-rule"></span></div>' +
    '<div class="subtopic-grid">';

  topic.subtopics.forEach(function(st){
    bodyHtml += '<div class="subtopic-block is-collapsed term-panel" data-search="' + escapeAttr((st.num + ' ' + st.title).toLowerCase()) + '">' +
      '<p class="subtopic-label">' +
        '<svg class="subtopic-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"></path></svg>' +
        '<span class="subtopic-num">' + st.num + '</span><span class="subtopic-title">' + st.title + '</span>' +
        '<span class="subtopic-count">' + st.subs.length + '</span>' +
      '</p>' +
      '<div class="subtopic-content"><div class="subtopic-content-inner">';

    var isRich = typeof st.subs[0] === 'object';
    if(isRich){
      bodyHtml += '<div class="note-grid">' + st.subs.map(function(s){
        var searchText = stripTags([s.num, s.title].join(' ')).toLowerCase();
        totalAll++;
        notesByNum[s.num] = { sub:s, topic:topic, subtopic:st };
        return '<button class="note-card note-item note-tab" data-note="' + s.num + '" data-search="' + escapeAttr(searchText) + '" type="button">' +
          '<span class="note-num">' + s.num + '</span><span class="note-title">' + s.title + '</span></button>';
      }).join('') + '</div>';
    } else {
      bodyHtml += '<div class="note-grid">' + st.subs.map(function(s){
        totalAll++;
        var m = s.match(/^(\S+)\s+(.+)$/);
        var num = m ? m[1] : '';
        var title = m ? m[2] : s;
        return '<span class="note-card note-item" data-search="' + escapeAttr(s.toLowerCase()) + '">' +
          '<span class="note-num">' + num + '</span><span class="note-title">' + title + '</span></span>';
      }).join('') + '</div>';
    }

    bodyHtml += '</div></div></div>';
  });
  bodyHtml += '</div>';

  section.innerHTML = bodyHtml;
  topicsEl.appendChild(section);
});

quicknav.innerHTML = qnHtml;

function escapeAttr(s){ return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function stripTags(html){ return html.replace(/<[^>]*>/g, '').replace(/\$/g, ''); }

  star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>',
  bulb: '<path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.5c.5.5 1 1.5 1 2.5h6c0-1 .5-2 1-2.5A7 7 0 0 0 12 2z"></path>',
  rocket: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>'
};
function svgIcon(name){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' + (ICONS[name] || '') + '</svg>'; }
function colorVars(c){ return ' style="--c:var(--' + c + ');--c-rgb:var(--' + c + '-rgb);"'; }
function iconBadge(item, sizeClass){
  var inner = item.iconText ? '<span>' + item.iconText + '</span>' : svgIcon(item.icon);
  return '<div class="np-icon-circle' + (sizeClass ? ' ' + sizeClass : '') + '"' + colorVars(item.color) + '>' + inner + '</div>';
}

// ---------- visual note blocks (Revision-Village-style cards) ----------
function renderBlocks(blocks){ return blocks.map(renderBlock).join(''); }
function renderBlock(b){
  if(b.type === 'intro') return renderIntro(b);
  if(b.type === 'ingredients') return renderIngredients(b);
  if(b.type === 'columns') return '<div class="np-columns">' + b.items.map(renderColumn).join('') + '</div>';
  if(b.type === 'steps') return renderSteps(b);
  if(b.type === 'cardgroup') return renderCardGroup(b);
  if(b.type === 'remember') return renderRemember(b);
  if(b.type === 'practice') return renderPractice(b);
  return '';
}
function renderColumn(col){
  if(col.type === 'cardgroup') return renderCardGroup(col);
  if(col.type === 'steps') return renderSteps(col);
  return '';
}
function renderIntro(b){
  return '<div class="np-intro">' + iconBadge(b) +
    '<p class="np-intro-text">' + b.text + '</p>' +
    '<div class="np-intro-formula">$' + b.formula + '$</div>' +
  '</div>';
}
function renderIngredients(b){
  var isList = b.layout === 'list';
  return '<div class="np-card"><h3 class="np-card-heading">' + b.heading + '</h3>' +
    '<div class="np-ingredients-grid' + (isList ? ' is-list' : '') + '">' + b.items.map(function(it){
      return '<div class="np-ingredient"' + colorVars(it.color) + '>' +
        iconBadge(it, 'np-icon-circle-sm') +
        '<div class="np-ingredient-text">' +
          '<p class="np-ingredient-label">' + it.label + '</p>' +
          (it.formula ? '<p class="np-ingredient-formula">$' + it.formula + '$</p>' : '') +
          (it.desc ? '<p class="np-ingredient-desc">' + it.desc + '</p>' : '') +
        '</div>' +
      '</div>';
    }).join('') + '</div>' +
  '</div>';
}
function renderCardGroup(col){
  return '<div class="np-card"><h3 class="np-card-heading">' + col.heading + '</h3>' +
    col.cards.map(function(c){
      return '<div class="np-subcard"' + colorVars(c.color) + '>' +
        '<div class="np-subcard-head">' + iconBadge(c) +
          '<div><p class="np-subcard-title">' + c.title + '</p><p class="np-subcard-desc">' + c.desc + '</p></div>' +
        '</div>' +
        (c.example ?
          '<div class="np-example"><span>$' + c.example.from + '$</span>' +
          '<span class="np-example-arrow">&rarr;</span>' +
          '<span class="np-highlight">$' + c.example.to + '$</span></div>' : '') +
        (c.miniSteps && c.miniSteps.length ?
          '<div class="np-mini-steps">' + c.miniSteps.map(function(s, i){
            return '<div class="np-mini-step"><span class="np-mini-num"' + colorVars(c.color) + '>' + (i + 1) + '</span><span>' + s + '</span></div>';
          }).join('') + '</div>' : '') +
      '</div>';
    }).join('') +
  '</div>';
}
function renderSteps(col){
  return '<div class="np-card">' +
    '<h3 class="np-card-heading">' + (col.icon ? '<span class="np-card-icon"' + colorVars(col.color) + '>' + svgIcon(col.icon) + '</span>' : '') + col.heading + '</h3>' +
    (col.question ? '<p class="np-we-question">' + col.question + '</p>' : '') +
    '<div class="np-steps' + (col.handwritten ? ' is-handwritten' : '') + '">' + col.steps.map(function(s, i){
      return '<div class="np-step">' +
        '<span class="np-step-num"' + colorVars(col.color) + '>' + (i + 1) + '</span>' +
        '<div class="np-step-body">' +
          '<p class="np-step-title"' + colorVars(col.color) + '>' + s.title + '</p>' +
          (s.desc ? '<p class="np-step-desc">' + s.desc + '</p>' : '') +
          '<div class="np-step-formula"' + colorVars(col.color) + '>' + s.formula + '</div>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>' +
  '</div>';
}
function renderRemember(b){
  return '<div class="np-remember">' +
    '<div class="np-icon-circle">' + svgIcon('star') + '</div>' +
    '<div class="np-remember-body"><p class="np-remember-label">Remember</p><p>' + b.text + '</p></div>' +
    '<div class="np-remember-deco">' + svgIcon('bulb') + '</div>' +
  '</div>';
}
function renderPractice(b){
  return '<div class="np-practice">' +
    '<div class="np-icon-circle">' + svgIcon('rocket') + '</div>' +
    '<div class="np-practice-body"><p class="np-practice-title">Practice makes progress!</p><p>' + b.text + '</p></div>' +
    '<a class="np-practice-btn" href="' + b.href + '">Let’s Practice ' + svgIcon('arrowRight') + '</a>' +
  '</div>';
}

// ---------- collapse / expand ----------
document.querySelectorAll('.subtopic-label').forEach(function(label){
  label.addEventListener('click', function(){
    label.closest('.subtopic-block').classList.toggle('is-collapsed');
  });
});
document.getElementById('expand-all').addEventListener('click', function(){
  document.querySelectorAll('.subtopic-block').forEach(function(b){ b.classList.remove('is-collapsed'); });
});
document.getElementById('collapse-all').addEventListener('click', function(){
  document.querySelectorAll('.subtopic-block').forEach(function(b){ b.classList.add('is-collapsed'); });
});

// ---------- rich note: click a tab pill to open its own page ----------
document.querySelectorAll('.note-tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    location.hash = 'note=' + tab.getAttribute('data-note');
  });
});

var notesOutline = document.getElementById('notes-outline');
var notePage = document.getElementById('note-page');

function showNotePage(num){
  var entry = notesByNum[num];
  if(!entry) return;
  notePage.style.setProperty('--accent', 'var(--' + entry.topic.accent + ')');
  notePage.style.setProperty('--accent-rgb', 'var(--' + entry.topic.accent + '-rgb)');
  notePage.innerHTML =
    '<button class="note-page-back" id="note-page-back" type="button">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>' +
      'Back to ' + entry.topic.label.replace(/&amp;/g, '&') + '' +
    '</button>' +
    '<div class="note-page-header">' +
      '<span class="note-page-badge">' + entry.sub.num + '</span>' +
      '<div class="note-page-titles">' +
        '<span class="note-page-eyebrow">' + entry.topic.num + ' &middot; ' + entry.subtopic.title + '</span>' +
        '<h2 class="note-page-title">' + entry.sub.title + '</h2>' +
      '</div>' +
    '</div>' +
    '<div class="note-page-body">' + renderBlocks(entry.sub.blocks) + '</div>';

  notesOutline.style.display = 'none';
  notePage.classList.add('show');
  window.scrollTo(0, 0);

  document.getElementById('note-page-back').addEventListener('click', function(){ location.hash = ''; });
  if(window.renderMathInElement){
    renderMathInElement(notePage, {
      delimiters: [{left:'$$', right:'$$', display:true}, {left:'$', right:'$', display:false}],
      throwOnError:false
    });
  }
}
function showNotesOutline(){
  notePage.classList.remove('show');
  notePage.innerHTML = '';
  notesOutline.style.display = '';
}
function syncFromHash(){
  var match = location.hash.match(/^#note=([\d.]+)$/);
  if(match && notesByNum[match[1]]) showNotePage(match[1]);
  else showNotesOutline();
}
window.addEventListener('hashchange', syncFromHash);
document.addEventListener('DOMContentLoaded', function(){
  if(window.renderMathInElement){
    renderMathInElement(document.getElementById('topics'), {
      delimiters: [{left:'$$', right:'$$', display:true}, {left:'$', right:'$', display:false}],
      throwOnError:false
    });
  }
  // run after KaTeX has loaded, so a direct link to a note page renders its math correctly
  syncFromHash();
});

// ---------- live filter ----------
var filterInput = document.getElementById('topic-filter');
var filterCount = document.getElementById('filter-count');
var noResults = document.getElementById('no-results');

function applyFilter(){
  var q = filterInput.value.trim().toLowerCase();
  var visibleCount = 0;
  topics.forEach(function(topic){
    var section = document.getElementById(topic.id);
    var anyVisibleInSection = false;
    section.querySelectorAll('.subtopic-block').forEach(function(block){
      var anyVisibleInBlock = false;
      block.querySelectorAll('.note-item').forEach(function(card){
        var matches = !q || card.getAttribute('data-search').indexOf(q) !== -1 || block.getAttribute('data-search').indexOf(q) !== -1;
        card.classList.toggle('is-hidden', !matches);
        if(matches){ visibleCount++; anyVisibleInBlock = true; }
      });
      block.classList.toggle('is-empty', !anyVisibleInBlock);
      block.classList.toggle('force-expand', !!q && anyVisibleInBlock);
      if(anyVisibleInBlock) anyVisibleInSection = true;
    });
    section.classList.toggle('is-empty', !anyVisibleInSection);
  });
  filterCount.textContent = q ? (visibleCount + ' match' + (visibleCount === 1 ? '' : 'es')) : (totalAll + ' sub-topics');
  noResults.classList.toggle('show', q && visibleCount === 0);
}
filterInput.addEventListener('input', applyFilter);

applyFilter();

document.getElementById('copy-link').addEventListener('click', function(){
  navigator.clipboard && navigator.clipboard.writeText(window.location.href);
});
</script>
